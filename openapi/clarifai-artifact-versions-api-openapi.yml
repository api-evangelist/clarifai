openapi: 3.2.0
info:
  title: proto/clarifai/api/service.proto Artifact Versions API
  version: version not set
tags:
- name: Artifact Versions
paths:
  /v2/artifact_versions/upload:
    post:
      summary: This is a streaming endpoint, the request has a field, upload_data, which can…
      operationId: V2_PostArtifactVersionsUpload
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/apiPostArtifactVersionsUploadResponse'
                  error:
                    $ref: '#/components/schemas/googlerpcStatus'
                title: Stream result of apiPostArtifactVersionsUploadResponse
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - Artifact Versions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiPostArtifactVersionsUploadRequest'
        description: ' (streaming inputs)'
        required: true
components:
  schemas:
    apiUpload:
      type: object
      properties:
        id:
          type: string
          title: ID of upload
        created_at:
          type: string
          format: date-time
          description: 'When the upload was started.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        modified_at:
          type: string
          format: date-time
          description: 'Most recent time when the upload was updated.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        expires_at:
          type: string
          format: date-time
          description: 'When the upload will expire and be deleted

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        status:
          $ref: '#/components/schemas/apistatusStatus'
          title: Status of the upload
        content_name:
          type: string
          title: name of uploaded content (e.g. filename)
        content_length:
          type: string
          format: uint64
          title: Total size of the upload content
        content_url:
          type: string
          title: Url of uploaded content
    apiArtifact:
      type: object
      properties:
        id:
          type: string
          title: ID of artifact
        user_id:
          type: string
          title: User ID that this Artifact belongs to
        app_id:
          type: string
          title: Application ID that this Artifact belongs to
        artifact_version:
          $ref: '#/components/schemas/apiArtifactVersion'
          title: Reference to the artifact version resource that represents a specific version of the artifact
        created_at:
          type: string
          format: date-time
          description: When the artifact was created.
        modified_at:
          type: string
          format: date-time
          description: Most recent time when the artifact was updated.
        deleted_at:
          type: string
          format: date-time
          description: When the artifact was deleted.
      description: 'Artifact is a resource that represents a file stored in Clarifai''s storage system.

        It should have a reference to upload resource which contains the actual file location and metadata.'
    apistatusStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/statusStatusCode'
          description: Status code from internal codes.
        description:
          type: string
          description: A short description of the error.
        details:
          type: string
          description: 'More details of the given error.

            These details may be exposed to non-technical users.

            For technical details, try to use developer_notes field.'
        stack_trace:
          type: array
          items:
            type: string
          description: 'For some environment we may return a stack trace to help debug

            any issues.'
        percent_completed:
          type: integer
          format: int64
          title: specifically for long running jobs
        time_remaining:
          type: integer
          format: int64
          title: if status is pending, how much time is remaining (in seconds)
        req_id:
          type: string
          title: A request ID may be present, to help monitoring and tracking requests
        internal_details:
          type: string
          description: Internal Annotation (do not set in production, for internal Clarifai use only).
        redirect_info:
          $ref: '#/components/schemas/statusRedirectInfo'
          description: Resource location info for redirect, when resource location has been changed.
        developer_notes:
          type: string
          description: 'Notes for developer.

            These notes are rather technical details for developers how to interpret the status,

            e.g. why an error occurred and how to avoid getting the error.'
        http_status_code:
          type: integer
          format: int64
          description: The HTTP status code of the response.
