    apiComputeInfo:
      type: object
      properties:
        cpu_limit:
          type: string
          description: 'Amount of CPUs to use as a limit. This follows kubernetes notation like: "1", "100m", "4.5", etc.

            See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/

            For instances, this is the instance''s CPU count.

            For runners, this is the maximum amount of CPU that the runner pod can use.'
        cpu_memory:
          type: string
          description: 'Amount of CPU memory to use as a limit. This follows kubernetes notation like:

            1Ki, 1500Mi, 3Gi, 4Ti, etc.

            See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/

            For instances, this is the instance''s CPU memory.

            For runners, this is the maximum amount of CPU memory that the runner pod can use.'
        cpu_requests:
          type: string
          description: 'Amount of CPUs to use as a minimum. This follows kubernetes notation like: "1", "100m", "4.5", etc.

            See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/

            For runners, this is the minimum amount of CPU requested for the runner pod.

            Optional. If unspecified, a small default is used.'
        cpu_memory_requests:
          type: string
          description: 'Amount of CPU memory to use as a minimum. This follows kubernetes notation like:

            1Ki, 1500Mi, 3Gi, 4Ti, etc.

            For runners, this is the minimum amount of CPU memory requested for the runner pod.

            Optional. If unspecified, a small default is used.'
        num_accelerators:
          type: integer
          format: int64
          description: Amount of GPU/TPUs to use.
        accelerator_memory:
          type: string
          description: "The supported accelerators that the resource can run on. If the resource requires a specific\n accelerator type then it will only be scheduled on nodes that have that type of accelerator.\n If there is no hard requirements beyond the number of accelerators and their memory then this\n field can be left empty.\n This setting will cause an error if num_accelerators == 0"
          title: 'Amount of accelerator/GPU memory to use as a minimum.

            This is defined per accelerator.

            This follows the format used by kubernetes like 1Ki, 2Mi, 3Gi, 4Ti.

            See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/'
        accelerator_type:
          type: array
          items:
            type: string
          description: 'Or should it be removed completely and use the nodepool accelerator type itself.

            These are the supported accelerators that the model can run on.'
        accelerator_topology:
