openapi: 3.2.0
info:
  title: proto/clarifai/api/service.proto Datasets API
  version: version not set
tags:
- name: Datasets
paths:
  /v2/datasets:
    get:
      summary: List all the datasets
      operationId: V2_ListDatasets3
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      - name: page
        description: '(optional URL parameter) The page number. Pagination is used to split the results into chunks.

          Defaults to 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        description: '(optional URL parameter) The number of results that will be contained in each page. Defaults

          to 128.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: additional_fields
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sort_ascending
        description: 'Sorting options:

          Whether to sort in ascending order. If false, will order in descending order.'
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_by_created_at
        description: Whether to order by the created_at time.
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_by_star_count
        description: Whether to order by the number of users stared the app
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_by_modified_at
        description: If neither sort option is set to true, will sort by modified_at.
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_by_id
        description: Whether to order by the external id
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_by_relevance
        description: Whether to order by search query relevance. Can only be used if search is not empty.
        in: query
        required: false
        schema:
          type: boolean
      - name: starred_only
        description: 'Filtering options:'
        in: query
        required: false
        schema:
          type: boolean
      - name: bookmark
        description: Filter datasets by bookmark. If set, only return bookmarked datasets. Otherwise none bookmarked datasets only.
        in: query
        required: false
        schema:
          type: boolean
      - name: search
        description: "Searching options:\nSpecify a search parameter in order to perform keyword search on the\nfollowing fields of the dataset:\n  - id\n  - description\n  - notes\n  - user_id (unless user_app_id.user_id is already set)\n\nKeywords are both normalized for search (so searching for \"satisfy\" matches \"satisfied\")\nand used for partial prefix-matching (so searching for \"clari\" matches \"clarifai\").\n\nNOTE: Both the list of fields searched and the exact keyword matching\nrules are subject to change and not guaranteed to be backwards-compatible."
        in: query
        required: false
        schema:
          type: string
      - name: id
        description: 'Fuzzy filter on dataset ID

          Deprecated: use search instead.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Datasets
    delete:
      summary: Delete one or more datasets in a single request
      operationId: V2_DeleteDatasets2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusBaseResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiDeleteDatasetsRequest'
        description: Request to delete several datasets by list of ids.
        required: true
    post:
      summary: Add datasets to an app.
      operationId: V2_PostDatasets2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiPostDatasetsRequest'
        description: Request to add one or more datasets.
        required: true
    patch:
      summary: Patch one or more datasets.
      operationId: V2_PatchDatasets2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiPatchDatasetsRequest'
        description: Request to patch several datasets.
        required: true
  /v2/datasets/{dataset_id}:
    get:
      summary: Get a specific dataset
      operationId: V2_GetDataset2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiSingleDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      - name: additional_fields
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Datasets
  /v2/datasets/{dataset_id}/inputs:
    get:
      summary: List all the dataset inputs in a dataset
      operationId: V2_ListDatasetInputs2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetInputResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      - name: page
        description: '(optional URL parameter) The page number. Pagination is used to split the results into chunks.

          Defaults to 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        description: '(optional URL parameter) The number of results that will be contained in each page. Defaults

          to 128.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      tags:
      - Datasets
    delete:
      summary: Delete one or more dataset inputs in a single request
      operationId: V2_DeleteDatasetInputs2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusBaseResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2DeleteDatasetInputsBody'
        required: true
    post:
      summary: Add dataset inputs to a dataset.
      operationId: V2_PostDatasetInputs2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetInputResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2PostDatasetInputsBody'
        required: true
  /v2/datasets/{dataset_id}/inputs/{input_id}:
    get:
      summary: Get a specific dataset input
      operationId: V2_GetDatasetInput2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiSingleDatasetInputResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: input_id
        description: Identify dataset input by id.
        in: path
        required: true
        schema:
          type: string
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      tags:
      - Datasets
  /v2/datasets/{dataset_id}/versions:
    get:
      summary: List all the dataset versions
      operationId: V2_ListDatasetVersions2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetVersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      - name: page
        description: '(optional URL parameter) The page number. Pagination is used to split the results into chunks.

          Defaults to 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        description: '(optional URL parameter) The number of results that will be contained in each page. Defaults

          to 128.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: request_origins
        description: (optional URL parameter) Filter by origin of dataset version
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - DATASET_VERSION_REQUEST_ORIGIN_NOT_SET
            - MANUAL
            - TRAINING
            - EVAL_GROUND_TRUTH
            - EVAL_PREDICTIONS
      tags:
      - Datasets
    delete:
      summary: Delete one or more dataset versions in a single request
      operationId: V2_DeleteDatasetVersions2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusBaseResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2DeleteDatasetVersionsBody'
        required: true
    post:
      summary: Add dataset versions to a dataset
      operationId: V2_PostDatasetVersions2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetVersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2PostDatasetVersionsBody'
        required: true
    patch:
      summary: Patch one or more dataset versions
      operationId: V2_PatchDatasetVersions2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetVersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2PatchDatasetVersionsBody'
        required: true
  /v2/datasets/{dataset_id}/versions/{dataset_version_id}:
    get:
      summary: Get a specific dataset version
      operationId: V2_GetDatasetVersion2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiSingleDatasetVersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: dataset_version_id
        description: Identify dataset version by id.
        in: path
        required: true
        schema:
          type: string
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      tags:
      - Datasets
  /v2/datasets/{dataset_id}/versions/{dataset_version_id}/exports:
    put:
      summary: Create export of a dataset version
      operationId: V2_PutDatasetVersionExports2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetVersionExportResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: dataset_version_id
        description: Identify dataset version by id.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2PutDatasetVersionExportsBody'
        required: true
  /v2/datasets/{dataset_id}/versions/{dataset_version_id}/metrics:
    get:
      operationId: V2_ListDatasetVersionMetricsGroups2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiMultiDatasetVersionMetricsGroupResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: dataset_id
        description: Identify dataset by id.
        in: path
        required: true
        schema:
          type: string
      - name: dataset_version_id
        description: Identify dataset version by id.
        in: path
        required: true
        schema:
          type: string
      - name: user_app_id.user_id
        description: Note user_id 'me' is reserved - it is the alias for the id of authorized user
        in: query
        required: false
        schema:
          type: string
      - name: user_app_id.app_id
        in: query
        required: false
        schema:
          type: string
      - name: page
        description: '(optional URL parameter) The page number. Pagination is used to split the results into chunks.

          Defaults to 1.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        description: '(optional URL parameter) The number of results that will be contained in each page. Defaults

          to 128.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: parent_paths
        description: Filter by parent path. Multiple parent paths are OR-ed. Empty list results in no filter.
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: types
        description: "Filter by parent type. Multiple types are OR-ed. Empty list results in no filter.\n\n - INPUT_TYPE: Group data examples by input type.\nExamples: images, videos, text, audio.\n - CONCEPT_ID: Group data examples by concept ID.\nExamples: inputs with cat concept, inputs with dog concept.\n - CONCEPTS_COUNT: Group data examples by concepts count.\nExamples: inputs with 20 concepts, inputs with 21 concepts.\n - BOUNDING_BOXES_COUNT: Group data examples by bounding boxes count.\nExamples: inputs with 20 bounding boxes, inputs with 21 bounding boxes.\n - POLYGONS_COUNT: Group data examples by polygons count.\nExamples: inputs with 20 polygons, inputs with 21 polygons.\n - POINTS_COUNT: Group data examples by points count.\nExamples: inputs with 20 points, inputs with 21 points.\n - MASKS_COUNT: Group data examples by masks count.\nExamples: inputs with 20 masks, inputs with 21 masks.\n - PIXELS_COUNT: Group data examples by pixels count.\nIn order to reduce the number of groups, we use bins.\nExamples for bin size = 400: inputs with [200000, 200400) pixels, inputs with [200400, 200800) pixels.\n - ASPECT_RATIO: Group data examples by aspect ratio.\nIn order to reduce the number of groups, we use bins.\nExamples for bin size = 0.1: inputs with [0.5, 0.6) aspect ratio, inputs with [0.6, 0.7) aspect ratio."
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - DATASET_VERSION_METRICS_GROUP_TYPE_NOT_SET
            - INPUT_TYPE
            - CONCEPT_ID
            - CONCEPTS_COUNT
            - BOUNDING_BOXES_COUNT
            - POLYGONS_COUNT
            - POINTS_COUNT
            - MASKS_COUNT
            - PIXELS_COUNT
            - ASPECT_RATIO
      tags:
      - Datasets
      summary: V2 list dataset version metrics groups2
      x-summary-source: derived
components:
  schemas:
    apiDatasetVersionExportFormat:
      type: string
      enum:
      - DATASET_VERSION_EXPORT_FORMAT_NOT_SET
      - CLARIFAI_DATA_PROTOBUF
      - CLARIFAI_DATA_JSON
      - COCO
      default: DATASET_VERSION_EXPORT_FORMAT_NOT_SET
      description: " - CLARIFAI_DATA_PROTOBUF: CLARIFAI_DATA_PROTOBUF is the proprietary Clarifai API Data format. It\nis a ZIP-archive containing batches of serialized InputBatch protobuf messages.\n\nNote that only the \"id\" and \"data\" fields of exported inputs are set.\n - CLARIFAI_DATA_JSON: CLARIFAI_DATA_JSON is the proprietary Clarifai API Data format in JSON. It\nis a ZIP-archive containing batches of serialized InputBatch JSON messages.\n\nNote that only the \"id\" and \"data\" fields of exported inputs are set.\n - COCO: COCO is the data format used by Common Objects in Context. It is a\nZIP-archive containing JSON files with the dataset version annotations.\nSee https://cocodataset.org/#format-data."
    apiOutput:
      type: object
      properties:
        id:
          type: string
          title: One of these outputs per Input
        status:
          $ref: '#/components/schemas/apistatusStatus'
        created_at:
          type: string
          format: date-time
          title: 'When the object was created. We follow the XXXX timestamp

            format. We use https://www.ietf.org/rfc/rfc3339.txt format:

            "2006-01-02T15:04:05.999999Z" so you can expect results like

            the following from the API:

            "2017-04-11T21:50:50.223962Z"'
        model:
          $ref: '#/components/schemas/apiModel'
          description: The model that created this Output.
        input:
          $ref: '#/components/schemas/apiInput'
          description: 'The input that was passed to the model to create this Output. For example if we have an image

            model then it will take as input here an Input object with Image filled in.'
        data:
          $ref: '#/components/schemas/apiData'
          description: 'The output data for this Output. For example if we have a concept model then the predicted

            concepts will appear here.'
        prompt_tokens:
          type: integer
          format: int64
          description: Number of prompt tokens as reported by the model or third-party API.
        completion_tokens:
          type: integer
          format: int64
          description: Number of completion tokens as reported by the model or third-party API.
        cached_tokens:
          type: integer
          format: int64
          description: 'Number of cached prompt tokens as reported by the model (subset of prompt_tokens).

            Cached tokens are prompt tokens served from the model''s KV cache rather than recomputed.'
      title: Output
    apiData:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/apiImage'
          description: Input and output images.
        video:
          $ref: '#/components/schemas/apiVideo'
          description: Input and output videos.
        concepts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiConcept'
          description: A list of concepts.
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        geo:
          $ref: '#/components/schemas/apiGeo'
          description: Geography information.
        colors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiColor'
          description: The dominant colors within an image.
        clusters:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiCluster'
          description: Clustering centroids for inputs.
        embeddings:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiEmbedding'
          description: Embedding vectors representing each input.
        regions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiRegion'
          description: For recursing into localized regions of an input.
        frames:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiFrame'
          description: For temporal content like video.
        text:
          $ref: '#/components/schemas/apiText'
          description: Input, output or annotation text.
        audio:
          $ref: '#/components/schemas/apiAudio'
          description: Input and output audio.
        tracks:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiTrack'
          description: Track information.
        time_segments:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiTimeSegment'
          description: Time segments information.
        hits:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiHit'
          title: Holds score, rank, and user, app, input IDs and search hit data
        heatmaps:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiImage'
          title: Heatmap as 2d image
        parts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiPart'
          description: 'For data messages that have multiple parts such as multi-modal

            requests, we allow you to specify those as a list of Data objects.'
