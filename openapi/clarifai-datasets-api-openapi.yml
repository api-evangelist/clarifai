    apiInput:
      type: object
      properties:
        id:
          type: string
          title: The ID for the input
        data:
          $ref: '#/components/schemas/apiData'
          description: The data passed along in this input.
        created_at:
          type: string
          format: date-time
          title: 'When the input was created. We follow the XXXX timestamp

            format. We use https://www.ietf.org/rfc/rfc3339.txt format:

            "2006-01-02T15:04:05.999999Z" so you can expect results like

            the following from the API:

            "2017-04-11T21:50:50.223962Z"'
        modified_at:
          type: string
          format: date-time
          description: When the input was modified.
        status:
          $ref: '#/components/schemas/apistatusStatus'
          description: 'This is the status at a per Input level which allows for

            partial failures.'
        dataset_ids:
          type: array
          items:
            type: string
          description: 'List of dataset IDs that this input is part of

            Currently, this field is ONLY used to

            * search inputs part of dataset(s), e.g. in `PostSearches`, `PostInputsSearches` and `PostAnnotationsSearches` endpoints, and

            * to add inputs to dataset(s) in `PostInputs` endpoint.

            Note that this field is ignored for other endpoints, e.g. `GetInput`, `ListInputs` and `PatchInputs`.'
