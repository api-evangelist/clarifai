          items:
            type: object
            $ref: '#/components/schemas/apiEvalTestSetEntry'
        metrics_by_area:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiBinaryMetrics'
        metrics_by_class:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiBinaryMetrics'
        tracker_metrics:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiTrackerMetrics'
        eval_info:
          $ref: '#/components/schemas/apiEvalInfo'
          description: 'Evaluation parameters to pass. Expected to match what

            is defined in the model type for the respective model.'
        extended_metrics:
          $ref: '#/components/schemas/apiExtendedMetrics'
      title: EvalMetrics
    apiWorkflow:
      type: object
      properties:
        id:
          type: string
          description: The workflows's unique id.
        app_id:
          type: string
          title: The app the workflow belongs to
        created_at:
          type: string
          format: date-time
          title: 'When the workflow was created. We follow the XXXX timestamp

            format. We use https://www.ietf.org/rfc/rfc3339.txt format:

            "2006-01-02T15:04:05.999999Z" so you can expect results like

