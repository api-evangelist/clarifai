            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        metadata:
          type: object
          title: 'To handle arbitrary json metadata, use a struct field

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        created_at:
          type: string
          format: date-time
          title: When the pipeline was created
        modified_at:
          type: string
          format: date-time
          title: When the pipeline was last modified
        config:
          $ref: '#/components/schemas/apiPipelineVersionConfig'
          title: Pipeline version configuration including step secrets
    apiOutputInfo:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/apiData'
          description: List of concepts or other output related data for the model.
        output_config:
          $ref: '#/components/schemas/apiOutputConfig'
          title: 'Model configuration...going away in favor of output_info.params and train_params over time.

            TO BE DEPRECATED'
        message:
          type: string
          description: For returning where to look for the Output info if not returning it.
        fields_map:
          type: object
          description: 'Map from the api.Data field names to the underlying model graph''s outputs. When using a

            PretrainedModelConfig the values in this map need to match the Triton config.pbtxt output names.'
        params:
          type: object
          description: 'For predicting with the various ModelType''s we accept a Struct (JSON object) worth of args

            that the ModelTypeField defines. During inference, the settings contained within are sent

            to the model predictor to alter predictions from this Model.'
        params_specs:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiModelTypeField'
          description: 'These allow you to specifcy addition fields that a specific model supports beyond those defined

            in it''s ModelType. This field is to be deprecated and will be replaced by MethodSignature

            proto.'
      description: 'OutputInfo defines some of the settings for each model version that PatchModels can effect. These

        parameters control some of the training or inference operations that this model can do.

        As the number of parameters continued to grow when we launched more ModelTypes we decided to move

        to using the OutputInfo.params field which is a Struct (or JSON object if you''re using

        our JSON REST APIs). This allows each ModelType to define the set of fields, their default values

        and description of each field so that we can display those in Portal and make the creation of

        Model''s very extensible. The OutputConfig object will eventually go away in favor of

        output_info.params struct.'
    apiDatasetVersion:
      type: object
      properties:
        id:
          type: string
          title: The ID for the dataset version
        created_at:
          type: string
          format: date-time
          description: 'When the dataset version was created.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        modified_at:
          type: string
          format: date-time
          description: 'When the dataset version was modified.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        app_id:
          type: string
          description: The app the dataset version belongs to.
        user_id:
          type: string
          description: The user the dataset version belongs to.
        dataset_id:
          type: string
          description: The dataset the dataset version belongs to.
        annotation_filter_config:
          $ref: '#/components/schemas/apiAnnotationFilterConfig'
          description: The dataset version will be generated based on a single annotation filter.
        model_predict_config:
          $ref: '#/components/schemas/apiModelPredictConfig'
          description: The dataset version will be generated based on model version inferences.
        status:
          $ref: '#/components/schemas/apistatusStatus'
          description: Status for this dataset version.
        description:
          type: string
          title: Description of the dataset version
        processing_info:
          $ref: '#/components/schemas/apiDatasetVersionProcessingInfo'
          description: 'Dataset version processing. If this is not set when the dataset version is

            created, then the dataset default_processing_info is copied instead. Later

            updates to default_processing_info will not apply to existing versions.'
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/apiDatasetVersionMetrics'
          title: Dataset version metrics
        export_info:
          $ref: '#/components/schemas/apiDatasetVersionExportInfo'
          title: Dataset version exports
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        embed_model_version_ids:
          type: array
          items:
            type: string
          description: The embedding models to return embeddings for. If empty, no embeddings are returned.
        request_origin:
          $ref: '#/components/schemas/apiDatasetVersionRequestOrigin'
          title: 'Read Only. Cannot be Set

            Origin of request for new dataset version'
      title: DatasetVersion
    apiConcept:
      type: object
      properties:
        id:
          type: string
          description: The concept's unique id.
        name:
          type: string
          description: The name of the concept in the given language.
        value:
          type: number
          format: float
          description: 'Used to indicate presence (1.0) or not (0.0) of this concept when making a request.

            This is also the prediction probability when returning predictions from our API.

            For convenience we use the default of 1.0 when making requests so the concept you provide is

            is treated as a positive (1.0) and not a negative (which would be value == 0.0).'
        created_at:
          type: string
          format: date-time
          description: 'When the concept was created. The format is https://www.ietf.org/rfc/rfc3339.txt .

            Example: "2006-01-02T15:04:05.999999Z". This field is used only in a response.'
        language:
          type: string
          description: 'The language in which the concept name is in. This is *ONLY* used in the response and setting

            it in a request is ignored since the default language of your app is used when creating

            or patching a Concept. To set other languages for your concept use the ConceptLanguage object

            and its corresponding endpoints.'
        app_id:
          type: string
          description: The application id that this concept is within. This can be ignored by most users.
        definition:
          type: string
          description: The definition for the concept. Similar to name. This can be ignored by most users.
        vocab_id:
          type: string
          description: 'The vocabulary that this concept belongs to. This is useful if you have different unique sets

            of concepts that you can separate out based on this field. For example "age_appearance" vs

            "gender_appearance" in a list of concept returned from the demographics model.'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        user_id:
          type: string
          description: The user the concept belongs to.
        keypoint_info:
          $ref: '#/components/schemas/apiKeypointInfo'
          title: Information about keypoints for this concept
        extra_info:
          $ref: '#/components/schemas/apiConceptExtraInfo'
          description: Optional extra info.
        metadata:
          type: object
          title: 'To handle arbitrary json metadata:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        image:
          $ref: '#/components/schemas/apiImage'
          title: Representative image for the concept
      title: Concept or tag
    apiFilter:
      type: object
      properties:
        negate:
          type: boolean
          title: 'If True then this will flip the meaning of this part of the

            query. This allow for queries such as dog AND ! metadata=={"blah":"value"}'
        annotation:
          $ref: '#/components/schemas/clarifaiapiAnnotation'
          description: "# Filter by worker fields such as model, workflow and user IDs\n - worker.model.model_version.id\n - worker.user.id\n - worker.workflow.version.id\n\n # Filter by other top-level fields\n - annotation_info.fields                  - filter by annotation info\n - input_level                             - filter only input-level annotations\n - status.code                             - filter by annotation status code\n - trusted                                 - filter only trusted annotations\n\n # Filter by space-time info fields, i.e. region, frames and time-segments\n - data                                    - filter only annotations without space-time info, e.g. classifications\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {}}`\n - data.frames[].frame_info                - filter only frame annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"frames\": [{\"frame_info\": {}}]}}`\n - data.regions[].region_info.bounding_box - filter only bounding box annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"regions\": [{\"region_info\": {\"bounding_box\":{}}}]}}`\n - data.regions[].region_info.mask         - filter only mask annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"regions\": [{\"region_info\": {\"mask\":{}}}]}}`\n - data.regions[].region_info.point        - filter only point annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"regions\": [{\"region_info\": {\"point\":{}}}]}}`\n - data.regions[].region_info.polygon      - filter only polygon annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"regions\": [{\"region_info\": {\"polygon\":{}}}]}}`\n - data.regions[].region_info.span         - filter only span annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"regions\": [{\"region_info\": {\"span\":{}}}]}}`\n - data.regions[].track_id                 - filter annotations by track_id\n                                           - in order to enable this, you need to provide \"track_id_value\" i.e. `{\"data\": {\"regions\": [{\"track_id\" : \"track_id_value\"}]}}`\n - data.time_segments[].time_info          - filter only time-segment annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"time_segments\": [{\"time_info\": {}}]}}`\n\n # Filter by other data fields\n - data.clusters[].id\n - data.concepts[].id\n - data.concepts[].name\n - data.concepts[].value\n - data.geo.geo_box[].geo_point.latitude\n - data.geo.geo_box[].geo_point.longitude\n - data.geo.geo_limit.type\n - data.geo.geo_limit.value\n - data.geo.geo_point.latitude\n - data.geo.geo_point.longitude\n - data.metadata.fields                    - filter by metadata\n                                           - Important to note: metadata key&value fields are OR-ed.\n                                           - example with 1 metadata key: searching by\n                                                     `{\n                                                     `  \"data\": {\n                                                     `    \"metadata\": {\n                                                     `      \"fields\": {\n                                                     `        \"foo\": {\n                                                     `          \"string_value\": \"bar\"\n                                                     `        },\n                                                     `      }\n                                                     `    }\n                                                     `  }\n                                                     `}\n                                                     will result in a search condition like `metadata includes {\"foo\": \"bar}`;\n                                           - example with 2 metadata keys: searching by\n                                                     `{\n                                                     `  \"data\": {\n                                                     `    \"metadata\": {\n                                                     `      \"fields\": {\n                                                     `        \"foo1\": {\n                                                     `          \"string_value\": \"bar2\"\n                                                     `        },\n                                                     `        \"foo2\": {\n                                                     `          \"string_value\": \"bar2\"\n                                                     `        }\n                                                     `      }\n                                                     `    }\n                                                     `  }\n                                                     `}\n                                                     will result in a search condition like `(metadata includes {\"foo1\": \"bar1\"}) OR (metadata includes {\"foo2\": \"bar2\"})`.\n - data.text                               - filter only text annotations\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"data\": {\"text\": {}}}`"
          title: "FILTER by annotation information.\n########## Supported fields ##########\n # Filter by ID fields\n - id                                      - example: `{\"id\": \"xyz\"}`\n - input_id\n - model_version_id\n - task_id\n - user_id"
        input:
          $ref: '#/components/schemas/apiInput'
          title: "FILTER by input information.\n########## Supported fields ##########\n - data.audio                              - filter only audio inputs\n                                           - in order to enable this, you need to set the field to an empty object, i.e. `{\"audio\": {}}`\n - data.image                              - filter only image inputs\n                                           - enable using `{\"image\": {}}`\n - data.text                               - filter only text inputs\n                                           - enable using `{\"text\": {}}`\n - data.video                              - filter only video inputs\n                                           - enable using `{\"video\": {}}`\n - dataset_ids[]                           - filter by dataset IDs\n                                           - example: `{\"dataset_ids\": [\"d1\", \"d2\"]}` will filter for inputs in d1 OR d2\n - status.code                             - filter by input status\n                                           - example: `{\"status\": {\"code\": 30000}}` to filter only for SUCCESS inputs"
        last_updated_time_range:
          $ref: '#/components/schemas/apiTimeRange'
          description: Filter by annotation last updated time range.
      title: Filter
    apiCooccurrenceMatrixEntry:
      type: object
      properties:
        row:
          type: string
          title: concept_id for the row
        col:
          type: string
          title: concept_id for the col
        count:
          type: integer
          format: int64
      title: 'NOTE: this is inefficient, should just have the order of the rows/cols'
    apiModelTypeField:
      type: object
      properties:
        path:
          type: string
          description: 'The path where the value of the field will be stored in the model version object.

            Example:

            "output_info.data" would be the Data message in the OutputInfo message.

            "output_info.output_config.language" is in the OutputConfig message within OutputInfo

            "input_info.params" is in the params struct within InputInfo.

            "output_info.params" is in the params struct within OutputInfo.

            "train_info.params" is in the params struct within TrainInfo.

            and so on.'
        field_type:
          $ref: '#/components/schemas/ModelTypeFieldModelTypeFieldType'
          description: 'The field for this field. This is often used for displaying the field in the UI whereas

            the DataType enum below defines the specific type of datain the Python function.'
        default_value:
          description: 'A default value. We use the Value field because we want to have structured data (just like

            google.protobuf.Struct but this is just a single value).'
        description:
          type: string
          description: Description for this field.
        placeholder:
          type: string
          description: Placeholder text for the UI element.
        model_type_enum_options:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiModelTypeEnumOption'
          description: List of options of the ENUM type and potentially additional fields they bring with them.
        internal_only:
          type: boolean
          description: If this field should appear for internal users only.
        required:
          type: boolean
          description: 'If this field is a required field. If True then during validation you won''t be able to create

            a model of this type with providing a value for this field. When False, the ModelType''s

            default_value will be used for this field.'
        model_type_range_info:
          $ref: '#/components/schemas/apiModelTypeRangeInfo'
          description: If the field_type is RANGE, this must be filled in.
        name:
          type: string
          title: name of method signature argument
        type:
          $ref: '#/components/schemas/apiModelTypeFieldDataType'
          description: The type of the argument.
        type_args:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiModelTypeField'
          title: 'type enum, and recursively set type_args with

            the inner type argumets in complex objects (e.g. List[Tuple[int, str]])'
        iterator:
          type: boolean
          description: this will be use to define whether the method argument supports streaming as an iterator.
        default:
          type: string
          description: 'This specify the default value of the method argument

            If this argument is not passed, the input is required. If it is explicitly set to None, the input is optional

            We define this as a string

            because the default value can be a string, int, float, bool, or a complex object like a JSON

            The default_value field above should not also be used.'
        is_param:
          type: boolean
          title: wheather it's a inference param or a modeltype field
      description: ModelTypeField stores a field value of a configurable type.
    apiNodeInput:
      type: object
      properties:
        node_id:
          type: string
          description: The id to a connected WorkflowNode which will be used as an input for current WorkflowNode.
      description: NodeInput represents inputs to a node of the graph.
