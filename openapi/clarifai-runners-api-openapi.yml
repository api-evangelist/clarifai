openapi: 3.2.0
info:
  title: proto/clarifai/api/service.proto Runners API
  version: version not set
tags:
- name: Runners
paths:
  /v2/runners/items/process:
    post:
      summary: This maintains a single request for asking the API if there is any work to be…
      operationId: V2_ProcessRunnerItems
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/apiMultiRunnerItemResponse'
                  error:
                    $ref: '#/components/schemas/googlerpcStatus'
                title: Stream result of apiMultiRunnerItemResponse
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - Runners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apiPostRunnerItemOutputsRequest'
        description: 'PostRunnerItemOutputsRequest

          This is the message that runners send to the API to communicate.

          At the end of the request it will have the RunnerItemOutput filled in

          with results of the workload the runner is processing. Other messages

          from the runner use this same proto to communicate over to the API

          and do handshakes. (streaming inputs)'
        required: true
components:
  schemas:
    TaskWorkerTaskWorkerStrategy:
      type: string
      enum:
      - WORKER_STRATEGY_NOT_SET
      - PARTITIONED
      - FULL
      - DYNAMIC
      default: WORKER_STRATEGY_NOT_SET
      description: " - PARTITIONED: The inputs will be partitioned in several partitions.\nEach worker will label one or more input partitions.\nAll inputs are assigned at task creation.\n - FULL: Each worker will label all inputs from input source.\nAll inputs are assigned at task creation.\n - DYNAMIC: Each worker will dynamically get 10 inputs assigned at a time.\nNo inputs are assigned at task creation."
    apiTaskInputSourceMetrics:
      type: object
      properties:
        inputs_count_estimated:
          type: string
          format: uint64
          title: Estimated number of inputs that are in the source of data
    clarifaiapiVisibility:
      type: object
      properties:
        gettable:
          $ref: '#/components/schemas/VisibilityGettable'
      description: 'Visibility represents how visible the given resource is to other users.

        When authenticating a request we can tell if a user is a collaborator or a teammate for the

        the app that contains the resource and set their allowed visibility. We use that to restrict

        what they are allowed to see:

        If AllowedVisibility is PRIVATE then we allow PRIVATE (10), ORG (30), PUBLIC (50)

        If AllowedVisibility is ORG then we allow ORG (30), PUBLIC (50)

        If AllowedVisibility is PUBLIC then we allow PUBLIC (50) only.'
    apiModelTypeEnumOptionAlias:
      type: object
      properties:
        id_int:
          type: string
          format: int64
          description: Integer alias for id.
        wildcard_string:
          type: string
          description: String that can contain wild cards and the regex needs to match.
    apiModelTypeFieldDataType:
      type: string
      enum:
      - NOT_SET
      - STR
      - BYTES
      - INT
      - FLOAT
      - BOOL
      - NDARRAY
      - JSON_DATA
      - TEXT
      - IMAGE
      - CONCEPT
      - REGION
      - FRAME
      - AUDIO
      - VIDEO
      - NAMED_FIELDS
      - TUPLE
      - LIST
      default: NOT_SET
      description: "DataType is used in MethodSignature to define all the possible types that a python function\nmay have that we want to support. These include built-ins like int, float, str, bool, and\nmore complex types like JSON, numpy arrays, List, Tuple, Dict (as Named Fields), as well as Clarifai provided\nunstructured types like Image, Video, Text, etc.\n\n - STR: A string value.\n - BYTES: A byte string. This is used for binary data.\n - INT: An integer value.\n - FLOAT: A float value.\n - BOOL: A boolean value.\n - NDARRAY: A proto representation for numpy arrays.\n - JSON_DATA: For arbitrary json object: \"{...}\"\n - TEXT: For text data\n - IMAGE: A image is a image proto for url or bytes.\n - CONCEPT: A concept is a concept proto that represents a concept in the app.\n - REGION: A region is a bounding box in an image or video frame.\n - FRAME: A frame is a single image in a video stream\n - AUDIO: A audio is a audio proto for url or bytes.\n - VIDEO: A video is a video proto for url or bytes.\n - NAMED_FIELDS: this can be used to store named fields with values similar to Dict\n - TUPLE: An arg that is a tuple.\n - LIST: An arg that is a list."
    apiSpecialHandling:
      type: object
      properties:
        id:
          type: string
        reason:
          $ref: '#/components/schemas/SpecialHandlingReason'
        done:
          type: boolean
          description: Whether special handling is done.
      description: Tracks special handling reason and whether it's been done.
    apiExtendedMetrics:
      type: object
      properties:
        user_metrics:
          type: object
    apiOutput:
      type: object
      properties:
        id:
          type: string
          title: One of these outputs per Input
        status:
          $ref: '#/components/schemas/apistatusStatus'
        created_at:
          type: string
          format: date-time
          title: 'When the object was created. We follow the XXXX timestamp

            format. We use https://www.ietf.org/rfc/rfc3339.txt format:

            "2006-01-02T15:04:05.999999Z" so you can expect results like

            the following from the API:

            "2017-04-11T21:50:50.223962Z"'
        model:
          $ref: '#/components/schemas/apiModel'
          description: The model that created this Output.
        input:
          $ref: '#/components/schemas/apiInput'
          description: 'The input that was passed to the model to create this Output. For example if we have an image

            model then it will take as input here an Input object with Image filled in.'
        data:
          $ref: '#/components/schemas/apiData'
          description: 'The output data for this Output. For example if we have a concept model then the predicted

            concepts will appear here.'
        prompt_tokens:
          type: integer
          format: int64
          description: Number of prompt tokens as reported by the model or third-party API.
        completion_tokens:
          type: integer
          format: int64
          description: Number of completion tokens as reported by the model or third-party API.
        cached_tokens:
          type: integer
          format: int64
          description: 'Number of cached prompt tokens as reported by the model (subset of prompt_tokens).

            Cached tokens are prompt tokens served from the model''s KV cache rather than recomputed.'
      title: Output
    apiFrame:
      type: object
      properties:
        frame_info:
          $ref: '#/components/schemas/apiFrameInfo'
          description: Information aboue frame such as number and time.
        data:
          $ref: '#/components/schemas/apiData'
          description: 'A recursive definition of the data within the Frame. For example, this will contain

            data.concepts if the Frame also has annotations or predictions of concepts within it.

            This can also have data.regions for annotation or predictions of detection regions, which can

            then recursively have their data field filled in as well.'
        id:
          type: string
          description: An ID for the frame.
      description: A Frame of time-series Data such as a Video.
    apiGeo:
      type: object
      properties:
        geo_point:
          $ref: '#/components/schemas/apiGeoPoint'
        geo_limit:
          $ref: '#/components/schemas/apiGeoLimit'
        geo_box:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiGeoBoxedPoint'
          title: 'NOTE: inconsistency: should have been geo_boxed_points'
      title: Geo
    apiCommitmentValue:
      type: object
      properties:
        value:
          type: integer
          format: int32
          title: The commitment value, in cents
        type:
          $ref: '#/components/schemas/CommitmentValueCommitmentType'
          title: The commitment type, can be either 'monthly' or 'annual'
      title: Commitment Value - used to track users' commitment amount and type
    apiLicenseType:
      type: string
      enum:
      - UNKNOWN_LICENSE_TYPE
      - FIRST_PARTY
      - OPEN_SOURCE
      - CLOSED_SOURCE
      default: UNKNOWN_LICENSE_TYPE
    TaskWorkerWorkerType:
      type: string
      enum:
      - WORKER_TYPE_NOT_SET
      - WORKER_HUMAN
      - WORKER_AUTO
      default: WORKER_TYPE_NOT_SET
      title: "- WORKER_TYPE_NOT_SET: for backward compatibility when task is not setting any type and only sets workers\n - WORKER_HUMAN: only human workers\n - WORKER_AUTO: auto-annotation tasks. Task must set worker as model or workflow"
    apiApp:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        default_language:
          type: string
        default_workflow_id:
          type: string
          description: 'Deprecated, use default_workflow instead.


            @exclude TODO (EAGLE-4506): Remove this field and associated code'
        default_workflow:
          $ref: '#/components/schemas/apiWorkflow'
        user_id:
          type: string
          title: 'why is user_id present here when this message type is used in PostApps but completely ignored there? PostApp already

            specifies the userid in path but doesn''t even actually use neither of userids, it instead used the id from auth context.

            This creates a lot of ambiguity, should always have different message types for Post/Get endpoints so that the minimum interface for each op can be described'
        created_at:
          type: string
          format: date-time
          title: 'When the app was created. We follow the XXXX timestamp

            format. We use https://www.ietf.org/rfc/rfc3339.txt format:

            "2006-01-02T15:04:05.999999Z" so you can expect results like

            the following from the API:

            "2017-04-11T21:50:50.223962Z"'
        modified_at:
          type: string
          format: date-time
          title: When the app was last modified
        legal_consent_status:
          type: integer
          format: int64
          title: if user accept legal consent for face recognition
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        description:
          type: string
          description: short description about the app.
        sample_ms:
          type: integer
          format: int64
          title: 'Default value for model predictions on video: Sample delay for video predicting (1 frame per N milliseconds)'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        data_tier_id:
          type: string
          description: data tier id this app is using.
        is_starred:
          type: boolean
          title: 'Is starred by the requesting user (only showed on get/list requests)

            Please use PostAppStars/DeleteAppStars endpoints to star/unstar an app'
        star_count:
          type: integer
          format: int32
          title: 'How many users have starred the app (only showed on get/list requests)

            Computed value, not editable'
        notes:
          type: string
          description: 'Notes for the application

            This field should be used for in-depth notes and supports up to 64Kbs.'
        image:
          $ref: '#/components/schemas/apiImage'
          title: Representative image for this app
        is_template:
          type: boolean
          description: 'An app marked as a template can be duplicated by any user that can see it,

            including all visible resources within it.'
        extra_info:
          $ref: '#/components/schemas/apiAppExtraInfo'
        embeddings_storage:
          $ref: '#/components/schemas/AppEmbeddingsStorage'
          title: 'Where app embeddings are stored

            postgres (default), qdrant'
      title: Application with tasks and datasets
    apiSecret:
      type: object
      properties:
        id:
          type: string
          title: The name of the secret, corresponds to id in model_version.output_info.params.secrets
        user_id:
          type: string
          description: The user the secret belongs to.
        value:
          type: string
          description: The value of the secret.
        version:
          type: integer
          format: int64
          description: The version of the secret.
        description:
          type: string
          description: The description of the secret.
        created_at:
          type: string
          format: date-time
          description: When the secret was created.
        modified_at:
          type: string
          format: date-time
          description: When the secret was last modified.
        expires_at:
          type: string
          format: date-time
          description: When the secret will expire.
    apiPointVisibility:
      type: string
      enum:
      - NOT_SET
      - VISIBLE
      - NOT_VISIBLE
      - NOT_PRESENT
      default: NOT_SET
      description: "- NOT_SET: Visibility of the point is not set\n - VISIBLE: Point is visible\n - NOT_VISIBLE: Point is occluded\n - NOT_PRESENT: Point is not in the image"
      title: Whether this point is visible or occluded
    apiPoint:
      type: object
      properties:
        row:
          type: number
          format: float
          description: 'The row location of the point. This has a [0.0-1.0] range with 0.0 being top row and 1.0

            being the bottom row.'
        col:
          type: number
          format: float
          description: 'The column location of the point. This has a [0.0-1.0] range with 0.0 being left col and 1.0

            being the right col.'
        z:
          type: number
          format: float
          description: Depth if applicable for the point.
        visibility:
          $ref: '#/components/schemas/apiPointVisibility'
      title: Point
    apiGeoLimit:
      type: object
      properties:
        type:
          type: string
        value:
          type: number
          format: float
      title: GeoLimit
    apiDeploymentMetricsSummary:
      type: object
      properties:
        desired_replicas:
          type: integer
          format: int64
          description: The number of replicas desired by the orchestrator.
        live_replicas:
          type: integer
          format: int64
          description: The actual number of live replicas connected and ready to process requests.
        rollout_in_progress:
          type: boolean
          description: If true, a new version is currently being rolled out.
      description: 'DeploymentMetricsSummary holds the core deployment metrics fields, reusable as both

        an aggregate across all nodepools and per-individual-nodepool metrics.'
    apiHostedURL:
      type: object
      properties:
        prefix:
          type: string
          description: Prefix of the URL of every hosted image.
        suffix:
          type: string
          description: Suffix of an image stored in different sizes.
        sizes:
          type: array
          items:
            type: string
          description: 'The sizes field lists which images of the different sizes are hosted in our storage. The URL

            of each hosted image can be obtained by joining the prefix, one of the sizes and suffix.'
        crossorigin:
          type: string
          title: 'The crossorigin property of html media tag

            For Secure Data Hosting this needs to be set to ''use-credentials'''
      title: HostedURL
    apiTaskMetrics:
      type: object
      properties:
        work:
          $ref: '#/components/schemas/apiTaskWorkMetrics'
        review:
          $ref: '#/components/schemas/apiTaskReviewMetrics'
        input_source:
          $ref: '#/components/schemas/apiTaskInputSourceMetrics'
    ModelTypeFieldModelTypeFieldType:
      type: string
      enum:
      - INVALID_MODEL_TYPE_FIELD_TYPE
      - BOOLEAN
      - STRING
      - NUMBER
      - ARRAY_OF_CONCEPTS
      - ARRAY_OF_CONCEPTS_WITH_THRESHOLD
      - RANGE
      - ENUM
      - COLLABORATORS
      - JSON
      - ARRAY_OF_NUMBERS
      - WORKFLOW_EMBED_MODELS
      - ARRAY_OF_STRINGS
      - RECURSIVE_ENUM
      - PYTHON_CODE
      - DATASET_ID
      - DATASET_VERSION_ID
      - ARRAY_OF_MODEL_CONCEPTS
      - DATASET
      - DATASET_VERSION
      - ENCRYPTED_STRING
      - CHECKPOINT_MODEL
      - ARRAY_OF_SECRETS
      default: INVALID_MODEL_TYPE_FIELD_TYPE
      description: "These are various types of fields that we have UIs for.\n\n - ARRAY_OF_CONCEPTS: For auto-completing to concepts in the app. This goes into an data.concepts field.\n - ARRAY_OF_CONCEPTS_WITH_THRESHOLD: For auto-completing to concepts in the app. This goes into an data.concepts field.\n - RANGE: A range for a float value.\n - ENUM: If ENUM is used then the \"enum_options\" field should also be filled in with the respective ID and description\nfor the different ENUM options.\n - COLLABORATORS: For listing collaborators of the app. The field is a string of the collaborator's user_id.\n - JSON: For arbitrary json object: \"{...}\"\n - ARRAY_OF_NUMBERS: Such as [1.0, 2.0, 3.5]\n - WORKFLOW_EMBED_MODELS: For selecting the embed_model_version_id for context based models.\n - ARRAY_OF_STRINGS: Such as ['a', 'b', 'cantaloupe']\n - RECURSIVE_ENUM: If RECURSIVE_ENUM is used then the \"enum_options\" field should also be filled in with the respective ID and\ndescription for the different RECURSIVE_ENUM options, as well as model_type_fields for each enum choice.\n - PYTHON_CODE: For blocks of code that need to be specified by the user for setup or execution during workflow runs.\n - DATASET_ID: For selecting a dataset id in model parameters. String in API request.\n - DATASET_VERSION_ID: For selecting a dataset version id. String.\n - ARRAY_OF_MODEL_CONCEPTS: For auto-completing to concepts in the model.\n - DATASET: For selecting a dataset\n - DATASET_VERSION: For selecting a dataset version\n - ENCRYPTED_STRING: To pass a string downstream, that is encrypted in the DB and API.\n - CHECKPOINT_MODEL: For selecting a model version of the same model type to resume training from.\n - ARRAY_OF_SECRETS: For model secrets"
    apiCooccurrenceMatrix:
      type: object
      properties:
        matrix:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiCooccurrenceMatrixEntry'
        concept_ids:
          type: array
          items:
            type: string
          description: These concept_ids are ordered by the strength of the diagonal in the ConfusionMatrix.
      title: CooccurrenceMatrix
    apiAudio:
      type: object
      properties:
        url:
          type: string
          description: 'This is a URL to a publicly accessible image file. The platform will download this file server

            side and then process.'
        base64:
          type: string
          format: byte
          description: 'The base64 field is using image file bytes directly in the request.

            NOTE: if you''re sending a json request, then this MUST be base64 encoded before sending (hence

            the name here).

            When using our grpc clients, you DO NOT need to base64 encode

            it yourself since the clients know how to do this for you automatically and will avoid the

            base64 encoding if they send a binary request.'
        allow_duplicate_url:
          type: boolean
          description: If True then you will be allowed to have multiple urls.
        hosted:
          $ref: '#/components/schemas/apiHostedURL'
          description: 'The hosted field lists original audio hosted in Clarifai storage. This field is currently used

            only in response.'
        audio_info:
          $ref: '#/components/schemas/apiAudioInfo'
          title: audio info
      title: Audio asset struct
    DeploymentSchedulingChoice:
      type: string
      enum:
      - UNKNOWN_SCHEDULING_CHOICE
      - FAIL
      - RANDOM
      - PRICE
      - PERFORMANCE
      - NETWORK
      - UTILIZATION
      - PREFER_SPOT
      - PREFER_ONDEMAND
      default: UNKNOWN_SCHEDULING_CHOICE
      description: "In some scenarios it may not be obvous how we should schedule a resource to underlying nodes\nwithin the nodepool(s) above. The SchedulerChoice allows us to specify how to decide which\nnodepool to use when there are multiple nodepools and how to decide which type of node\nwithin a nodepool if there are multiple types.\nIf here are multiple nondepools then a decision on which to use comes into play\nif it is not specified in the prediction request.\nEven with a single nodepool a choice may come up such as when a resource that needs scheduling\nhas not specified the accelerator types it supports and the nodepool has multiple types.\n\n - FAIL: fail if there is any ambiguity.\n - RANDOM: randomly pick amongst the nodepools/nodes to assign.\n - PRICE: choose the compute that is cheaper\n - PERFORMANCE: schedule to the fastest known iption.\n - NETWORK: optimize based on network latency.\n - UTILIZATION: send to the least used nodepool based on it's capacity.\n - PREFER_SPOT: choose spot instances over on-demand\n - PREFER_ONDEMAND: choose on-demand instances over spot."
    apiWorkflowVersion:
      type: object
      properties:
        id:
          type: string
          description: Id of this version.
        workflow_id:
          type: string
          description: Workflow id for this version.
        created_at:
          type: string
          format: date-time
          description: 'When the version was created.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        modified_at:
          type: string
          format: date-time
          description: 'Most recent time when the version was updated.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        nodes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiWorkflowNode'
          description: 'The list of nodes that make up the workflow version. Each node can specify an input node

            that it connects to in order to define the graph.'
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        app_id:
          type: string
          description: The app the workflow version belongs to.
        user_id:
          type: string
          description: The user the workflow version belongs to.
        description:
          type: string
          title: Short description about this workflow version
        license:
          type: string
          title: License associated to this workflow version
        is_deprecated:
          type: boolean
          description: 'If a model version associated with the workflow version is deleted, the workflow version

            will be marked as deprecated.'
      title: WorkflowVersion
    apiText:
      type: object
      properties:
        raw:
          type: string
          description: This is a raw text string.
        url:
          type: string
          title: Url to a text file
        allow_duplicate_url:
          type: boolean
        hosted:
          $ref: '#/components/schemas/apiHostedURL'
          description: 'The hosted field lists original text hosted in Clarifai storage. This field is currently used

            only in response.'
        text_info:
          $ref: '#/components/schemas/apiTextInfo'
          title: text info
      title: Text
    apiFullTag:
      type: object
      properties:
        name:
          type: string
          title: Display name of the tag. Ex. "English"
        id:
          type: string
          title: Id value for referencing. Ex. "en"
    apiMultiRunnerItemResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/apistatusStatus'
        runner_items:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiRunnerItem'
      title: MultiRunnerItemResponse
    apiFrameInterpolationInfo:
      type: object
      properties:
        sample_ms:
          type: integer
          format: int64
          description: 'sample_ms is the sampling rate at which frame annotations are interpolated.

            If sample_ms is zero, then the dataset default_processing_info value is used.

            If the dataset default is zero or not set, then the input frame prediction

            sampling rate is used.'
      description: 'FrameInterpolationInfo contains information about frame annotations

        interpolated from other video annotations, such as image object-detection

        regions generated from video object-tracking regions.'
    SearchMetric:
      type: string
      enum:
      - METRIC_NOT_SET
      - EUCLIDEAN_DISTANCE
      - COSINE_DISTANCE
      default: METRIC_NOT_SET
      description: 'Metric used for search. Can be EUCLIDEAN_DISTANCE (default) or COSINE_DISTANCE.

        Currently only brute force search supports non-eudlicean metrics.'
    apiDataset:
      type: object
      properties:
        id:
          type: string
          title: The ID for the dataset
        created_at:
          type: string
          format: date-time
          description: 'When the dataset was created.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        modified_at:
          type: string
          format: date-time
          description: 'When the dataset was modified.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        app_id:
          type: string
          description: The app the dataset belongs to.
        user_id:
          type: string
          description: The user the dataset belongs to.
        description:
          type: string
          title: Description of the dataset
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        default_annotation_filter:
          $ref: '#/components/schemas/apiAnnotationFilter'
          description: Default annotation filter used for this dataset.
        default_processing_info:
          $ref: '#/components/schemas/apiDatasetVersionProcessingInfo'
          description: Default processing info used for this dataset.
        notes:
          type: string
          description: 'Notes for the dataset

            This field should be used for in-depth notes and supports up to 64Kbs.'
        version:
          $ref: '#/components/schemas/apiDatasetVersion'
          description: 'Dataset version associated with this dataset. This is used in listing Datasets

            and including the latest version.'
        is_starred:
          type: boolean
          description: Whether the dataset is starred by the requesting user.
        star_count:
          type: integer
          format: int32
          description: Number of users that starred this dataset.
        bookmark_origin:
          $ref: '#/components/schemas/apiBookmarkOrigin'
          description: 'bookmark info. When set, this dataset is a bookmarked dataset of this app.

            Info in this field will allow you to find/access original dataset.'
        image:
          $ref: '#/components/schemas/apiImage'
          title: Representative image for this dataset
