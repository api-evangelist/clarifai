            type: string
          title: Tags for check consents
        bookmark_origin:
          $ref: '#/components/schemas/apiBookmarkOrigin'
          description: 'bookmark info. When set, this workflow is a bookmarked workflow of this app.

            Info in this field will allow you to find/access original workflow.'
        image:
          $ref: '#/components/schemas/apiImage'
          title: Representative image for this workflow
      title: Workflow
    apiTimeInfo:
