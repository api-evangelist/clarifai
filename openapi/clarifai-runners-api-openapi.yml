      - SERVER_ERROR
      default: ZERO
      description: "expired cc, still in trial, feature not supported in your tier\n - CONN_TOKEN_INVALID: invalid auth token used. Deprecated: we should return CONN_KEY_INVALID instead now in all cases.\n - CONN_CREDENTIALS_INVALID: invalid auth credentials\n - CONN_EXCEED_HOURLY_LIMIT: throttle hourly limit exceeded\n - CONN_EXCEED_MONTHLY_LIMIT: throttle monthly limit exceeded\n - CONN_THROTTLED: throttler and billing stuff\n - CONN_EXCEEDS_LIMITS: throttler and billing stuff\n - CONN_INSUFFICIENT_SCOPES: api key has insufficient permissions\n - CONN_KEY_INVALID: api key is invalid\n - CONN_KEY_NOT_FOUND: api key not found\n - CONN_BAD_REQUEST_FORMAT: multipart form parsing, broken json, etc\n - CONN_DOES_NOT_EXIST: when path is bad\n - CONN_INVALID_REQUEST: something wrong with a header\n - CONN_METHOD_NOT_ALLOWED: when a request method is not allowed\n - CONN_NO_GDPR_CONSENT: lack GDPR consent\n - CONN_INVALID_RANGE: when invalid range of a resource is requested\n - CONN_AUTH_METHOD_DISABLED: authentication method is disabled\n - MODEL_TRAINED: Model/Custom Training related 20xxx\n\nCustom model has been already trained.\n - MODEL_TRAINING: Custom model is currently training.\n - MODEL_UNTRAINED: Custom model has not yet been trained.\n - MODEL_QUEUED_FOR_TRAINING: Custom model is currently in queue for training, waiting on assets to process first.\n - MODEL_TRAINING_FAILED: generic err msg for any type of model training err.\n - MODEL_BUILDING: For new V3 DockerInternalType models which are built images\n - MODEL_BUILDING_FAILED: Failed to build image for model.\n - MODEL_BUILD_UNEXPECTED_ERROR: Failed to build image for model.\n - MODEL_TRAINING_NO_DATA: Custom model training had no data.  FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_NO_POSITIVES: Custom model training had no positive examples. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_ONE_VS_N_SINGLE_CLASS: Custom model training was ONE_VS_N but with a single class. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_TIMED_OUT: Training took longer than hard coded timeouts. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_WAITING_ERROR: Training got error waiting on asset pipeline to finish. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_UNKNOWN_ERROR: Training threw an unknown exception.\n - MODEL_TRAINING_MSG_REDELIVER: Training message was redelivered. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_INSUFFICIENT_DATA: Training got error due to insufficient labelled data. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_INVALID_PARAMS: FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_TRAINING_INVALID_DATA_TOLERANCE_EXCEEDED: Training is stopped because too much data was dropped. FIXME(yang): deprecate this. Use the 21106 + errStatusMsg\n - MODEL_EVALUATION_TIMED_OUT: Evaluation took longer than hard coded timeouts. FIXME(yang): deprecate this. Use the 21317 + errStatusMsg\n - MODEL_EVALUATION_WAITING_ERROR: Evaluation got error waiting on asset pipeline to finish.FIXME(yang): deprecate this. Use the 21317 + errStatusMsg\n - MODEL_EVALUATION_UNKNOWN_ERROR: EVALUATION THREW AN UNKNOWN EXCEPTION.\n - MODEL_EVALUATION_MSG_REDELIVER: Eval message was redelivered. FIXME(yang): deprecate this. Use the 21317 + errStatusMsg\n - MODEL_EVALUATION_NEED_LABELS: Don't have enough concepts labelled to perform evaluation. FIXME(yang): deprecate this. Use the 21317 + errStatusMsg\n - MODEL_EVALUATION_NEED_INPUTS: Don't have enough inputs per concept to perform evaluation. FIXME(yang): deprecate this. Use the 21317 + errStatusMsg\n - MODEL_EVALUATION_FAILED: Generic err code for eval failure.\n - MODEL_DEPLOYMENT_FAILED: Used when inference coordinator failed to deploy spire and throws an error\n - MODEL_DEPLOYING: Used when calling the inference coordinator to deploy a spire\n - MODEL_QUEUED_FOR_DEPLOYMENT: Used when training is completed\n - MODEL_NOT_DEPLOYED: Used when model spire deployment is manually taken down or due to inactivity\n - MODEL_LOADING: Used when the model pod is running, but not yet ready to serve requests.\n - MODEL_REFERENCE_INVALID_ARGUMENT: Used when a model reference field is not set properly\n - MODEL_EXAMPLE_INPUT_INVALID_ARGUMENT: Used when a model example input field is not set properly\n - MODEL_EXPORTED: Model Export status codes\n - WORKFLOW_NO_MATCHING_INPUT: specified model input not in workflow\n - WORKFLOW_REQUIRE_TRAINED_MODEL: specified model must be trained\n - WORKFLOW_INVALID_ARGUMENT: error in the request somewhere\n - WORKFLOW_INVALID_REQUEST: error in the request somewhere\n - CONCEPT_MODIFY_SUCCESS: Concept related 23xxx\n - ANNOTATION_SUCCESS: Annotation related 24xxx\n - ANNOTATION_AWAITING_REVIEW: Annotation is awaiting review from task REVIEWERS.\n - ANNOTATION_AWAITING_CONSENSUS_REVIEW: Annotation is awaiting consensus review from task LABELERS.\n - ANNOTATION_TRACK_IDLE: Annotation (video) tracks are groups of annotations per frame\nIDLE -> PROCESSING --> PENDING --> APPROVED --> (DELETED)\nPROCESSING --> FAILED --> (DELETED)\nPROCESSING --> (DELETED)\n - METADATA_INVALID_PATCH_ARGUMENTS: Metadata related 249xx\n - TRAINER_JOB_STATE_NONE: Training service related 25xxx\n - DATA_DUMP_SUCCESS: Data Dump related 251xx\n - DATA_DUMP_NO_DATA: DEPRECATED: Not used anymore. Now for an empty data dump, DATA_DUMP_SUCCESS is returned. To detect an empty data dump, check if the inptus count is 0.\n - APP_DUPLICATION_SUCCESS: Duplicate related 252xx - DEPRECATED: App duplication is no longer supported.\n - MODULE_DOES_NOT_EXIST: Module related codes 253xx\n - BULK_OPERATION_SUCCESS: Bulk Operation related codes 254xx\n - RUNNER_DOES_NOT_EXIST: Runner related codes 256xx\n - NODEPOOL_DOES_NOT_EXIST: Nodepool related codes 257xx\n - COMPUTE_CLUSTER_DOES_NOT_EXIST: ComputeCluster related codes 258xx\n - DEPLOYMENT_DOES_NOT_EXIST: Deployment related codes 259xx\n - DEPLOYMENT_DISABLED: The deployment is disabled and cannot serve traffic.\n - INSTANCE_TYPE_DOES_NOT_EXIST: InstanceType related codes 260xx\n - COMPUTE_PLANE_METRICS_INVALID_REQUEST: Compute plane related codes 261xx\n - PIPELINE_STEP_DOES_NOT_EXIST: PipelineStep related codes 262xx\n - PIPELINE_DOES_NOT_EXIST: Pipeline related codes 263xx\n - ARTIFACT_DOES_NOT_EXIST: Artifact related codes 264xx\n - INPUT_SUCCESS: Input:Image related 30xxx\n - INPUT_PENDING: when things are async, this is the default status.\n - INPUT_FAILED: any type of error downloading and processing\n - INPUT_DOWNLOAD_SUCCESS: use INPUT_SUCCESS, INPUT_PENDING, INPUT_FAILED, INPUT_IN_PROGRESS instead\nDOWNLOAD is no longer correct, but keep old statuses for backward compatibility\n - INPUT_VIDEO_DOWNLOAD_SUCCESS: Input:Video related 31xxx -- Deprecated\n - INPUT_WRITES_DISABLED_FOR_MAINTENANCE: deprecate this one. Use REQUEST_DISABLED_FOR_MAINTENANCE\n - PREDICT_INVALID_REQUEST: API formatting issues 4000x\n - DATABASE_DUPLICATE_KEY: Other related 400xx\n - EXTERNAL_CONNECTION_ERROR: could not connect to external services\n - QUEUE_CONN_ERROR: Queue related errors 41xxx\n - SQS_OVERLIMIT: SQS related errors 411xx\n - SEARCH_INTERNAL_FAILURE: Search related errors 43xxxx\n - EVALUATION_QUEUED: Workflow evaluation err code\n - STRIPE_EVENT_ERROR: Stripe 44xxx\n - CACHE_MISS: Redis/Cache 45xxx\n - SIGNUP_EVENT_ERROR: Sift Science 46xxx\n - APP_COUNT_INVALID_MESSAGE: Application counts related errors 470xx\n - MP_DOWNLOAD_ERROR: Media processor related errors 471xx -- DEPRECATED\n - DATATIER_CONN_ERROR: DataTier related error 472xx\n - USER_CONSENT_FACE: User legal consent stauts related 50xxx\n - WORKER_MISSING: Workers 51xxx\n - SSO_IDENTITY_PROVIDER_DOES_NOT_EXIST: SSO 53xxx\n - TASK_IN_PROGRESS: Tasks 54xxx\nThe task was created.\n - TASK_DONE: The task is completed.\n - TASK_WONT_DO: The task is marked as abandoned.\n - TASK_FAILED: An error occurred during add-task-annotations or add-auto-annotations pipeline.\n - TASK_IDLE: Task is waiting for user action.\nExamples:\n- When an Auto Annotation task job has finished processing its last batch and is waiting for more dataset assets.\n- When an Auto Annotation task job for a video livestream input is waiting for user to create a task deployment.\n - TASK_CONFLICT: The task operation is in conflict with the current state of the server.\n - TASK_NOT_IMPLEMENTED: Certain task-related scenarios are not implemented.\n - TASK_MISSING: Task was not found.\n - TASK_PERMISSION_DENIED: Not allowed to perform a task-related action.\n - TASK_ASSIGNMENT_SUCCESS: Task Assignments 542xx\n - TASK_ASSIGNMENT_REVIEW_SUCCESS: Task Assignment Reviews 543xx\n - LABEL_ORDER_PENDING: Label Order Related Status Code 55xxx\n - LICENSE_ACTIVE: License Related Status Code 600xx\nDEPRECATED: License feature is fully deprecated now.\n - LICENSE_DELETED: hidden state not reflected to users\n - PASSWORD_VALIDATION_SUCCESS: Password Related Status Code\n - FEATUREFLAG_CONFIG_NOT_FOUND: Feature flags status code\n - MAINTENANCE_SUCCESS: Maintenance status code\n - DATASET_VERSION_PENDING: Datasets 64xxx\nThe dataset version is pending to be processed.\n - DATASET_VERSION_IN_PROGRESS: The dataset version is currently being processed.\n - DATASET_VERSION_READY: The dataset version is ready to be used.\n - DATASET_VERSION_FAILURE: An error occurred during the dataset version processing.\n - DATASET_VERSION_UNEXPECTED_ERROR: An unexpected error occurred during the dataset version processing.\n - DATASET_VERSION_CONFLICT: An alteration to dataset version would create a conflict\n - DATASET_INPUT_SUCCESS: The dataset input was successfully added.\n - DATASET_INPUT_DUPLICATE: The dataset input is a duplicate.\nDeprecated: Unused.\n - DATASET_VERSION_EXPORT_SUCCESS: The dataset version export is completed.\n - DATASET_VERSION_EXPORT_PENDING: The dataset version is pending to be exported.\n - DATASET_VERSION_EXPORT_FAILED: An error occurred during the dataset version export.\n - DATASET_VERSION_EXPORT_IN_PROGRESS: The dataset version is currently being exported.\n - DATASET_VERSION_EXPORT_UNEXPECTED_ERROR: An unexpected error occurred during the dataset version export.\n - JOB_QUEUED: Generic Job status codes\n - AUTH_MISSING_IDP_ASSOC: auth issues\n\nTODO: Knowledge graph related 80xxx\n - UPLOAD_IN_PROGRESS: Multipart uploading status codes\n - BILLING_INVALID_INFO: Billing related issues: 69xxx\n - LOG_ENTRIES_INVALID_REQUEST: Logs related issues: 70000;\n - TWILIO_MAX_VERIFICATION_BEGIN_EXCEEDED: Twilio related issues: 71xxx\n - TWILIO_PHONE_NUMBER_BLOCKED: The provided phone number was rejected or blocked by Twilio.\n - INTERNAL_SERVER_ISSUE: Internal issues: 98xxx\n - CONN_UNCATEGORIZED: Uncategorized: 99xxx: move off as soon as known\n - BAD_REQUEST: Deprecated: migrate off to one of the internal issues\n - SERVER_ERROR: Deprecated: migrate off to one of the internal issues"
      title: "- ZERO: to be revised and greatly expanded\n - SUCCESS: Generic\n - MOVED: Resource moved. Respond with Http status 307 and add new Location header to response\n - ACCEPTED: Request has been accepted. Respond with Http status 202.\n - CONN_ACCOUNT_ISSUES: Clarifai Connection Codes: 11xxx"
    apiData:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/apiImage'
          description: Input and output images.
        video:
          $ref: '#/components/schemas/apiVideo'
          description: Input and output videos.
        concepts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiConcept'
          description: A list of concepts.
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        geo:
          $ref: '#/components/schemas/apiGeo'
          description: Geography information.
        colors:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiColor'
          description: The dominant colors within an image.
        clusters:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiCluster'
          description: Clustering centroids for inputs.
        embeddings:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiEmbedding'
          description: Embedding vectors representing each input.
        regions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiRegion'
          description: For recursing into localized regions of an input.
        frames:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiFrame'
          description: For temporal content like video.
        text:
          $ref: '#/components/schemas/apiText'
          description: Input, output or annotation text.
        audio:
          $ref: '#/components/schemas/apiAudio'
          description: Input and output audio.
        tracks:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiTrack'
          description: Track information.
        time_segments:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiTimeSegment'
          description: Time segments information.
        hits:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiHit'
          title: Holds score, rank, and user, app, input IDs and search hit data
        heatmaps:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiImage'
          title: Heatmap as 2d image
        parts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiPart'
          description: 'For data messages that have multiple parts such as multi-modal

            requests, we allow you to specify those as a list of Data objects.'
        ndarray:
          $ref: '#/components/schemas/apiNDArray'
          description: 'A proto representation for numpy arrays, useful to pass information from python SDK to a

            python based model implementation.'
        int_value:
          type: string
          format: int64
          title: Input and output integer number
        float_value:
          type: number
          format: double
          title: Input and output floating number
        bytes_value:
          type: string
          format: byte
          title: Input and output bytes data
        bool_value:
          type: boolean
          title: Input and output bool data
        string_value:
          type: string
          title: Input and output string data
        struct_value:
          type: object
          title: To handle Input and output json
      title: Data
    apiDeployment:
      type: object
      properties:
        id:
          type: string
          description: An id for this configured deployment.
        user_id:
          type: string
          description: The user who owns the deployment. These live in the user/org account.
        autoscale_config:
          $ref: '#/components/schemas/apiAutoscaleConfig'
          description: "How to autoscale the object.\n\nYou can configure different autoscaling per nodepool(s).\n These nodepools have to be also owned by the same user_id/org as this deployment.\n If there is more than one nodepool we use the model's ComputeInfo to match\n with what the nodepool provides to decide which one can handle it combined with the\n NodepoolRank below. Note: even within a single nodepool if it is heterogeneous then\n we need a way to rank scheduling choices when we don't know how to decide (like a model\n supports"
        nodepools:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiNodepool'
          title: Use DeploymentNodepools field instead
        scheduling_choice:
          $ref: '#/components/schemas/DeploymentSchedulingChoice'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        metadata:
          type: object
          title: 'To handle arbitrary json metadata:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        description:
          type: string
          description: Short description of deployment.
        worker:
          $ref: '#/components/schemas/apiWorker'
          title: 'The thing that the autoscaling config applies to for this nodepool.

            For a given user_id, nodepool_id, and object ID we can only have one deployment as it defines'
        desired_worker:
          $ref: '#/components/schemas/apiWorker'
        created_at:
          type: string
          format: date-time
          description: When the deployment was created.
        modified_at:
          type: string
          format: date-time
          description: When the deployment was last modified.
        deploy_latest_version:
          type: boolean
          title: Whether to always deploy latest model version
        special_handling:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiSpecialHandling'
          description: List of special handling instructions for this deployment.
        email_reminder_after:
          type: string
          description: 'Duration after which to send a reminder email if pods are still running.

            If set, users will receive a one-time email notification when any runner

            under this deployment has been running longer than this duration.'
        graceful_deploy:
          type: boolean
          title: Whether to gracefully deploy a new worker
        deployment_nodepools:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiDeploymentNodepool'
          description: 'Per-nodepool settings including priority. If set, ''nodepools'' must not also be set.

            When any priority value is non-zero, the response will populate this field instead

            of ''nodepools''.'
        deployment_metrics:
          $ref: '#/components/schemas/apiDeploymentMetrics'
          description: Real-time metrics for this deployment, including the desired and live replica counts.
        status:
          $ref: '#/components/schemas/apiDeploymentStatus'
          description: 'The current status of the deployment.

            When disabled, all infrastructure is scaled to zero and prediction requests are rejected.

            The autoscale_config is preserved for when the deployment is enabled.'
      description: 'A deployment allows you to configure how runners for a particular type of resource will

        scale up and down. These are unique per user_id, nodepool and model so for differnet nodepools

        you can scale differently.'
    apiAnd:
      type: object
      properties:
        input:
          $ref: '#/components/schemas/apiInput'
          title: "FILTER by input.data... information.\nThis can include human provided concepts, geo location info, metadata, etc.\nThis is effectively searching over only the trusted annotation attached to an input in your\napp. To search by more specific annotation fields use the Annotation object here.\n########## Supported fields ##########\n - data.concepts[].id\n - data.concepts[].name\n - data.concepts[].value\n - data.geo.geo_box[].geo_point.latitude\n - data.geo.geo_box[].geo_point.longitude\n - data.geo.geo_limit.type\n - data.geo.geo_limit.value\n - data.geo.geo_point.latitude\n - data.geo.geo_point.longitude\n - data.image.url\n - data.metadata.fields - filter by metadata. metadata key&value fields are OR-ed.\n - dataset_ids[] - filter by dataset IDs\n - id - filter by input ID\n - status.code - filter by input status"
        output:
          $ref: '#/components/schemas/apiOutput'
          description: "RANK based predicted outputs from models such as custom trained models, pre-trained models,\netc. This is also where you enter the image url for a visual search because what we're asking\nthe system to do is find output embedding most visually similar to the provided input (that\ninput being in And.output.input.data.image.url for example). This will return the Hits\nsorted by visual similarity (1.0 being very similar or exact match and 0.0 being very\ndissimlar). For a search by Output concept, this means we're asking the system to rank\nthe Hits by confidence of our model's predicted Outputs. So for example if the model\npredicts an image is 0.95 likely there is a \"dog\" present, that should related directly\nto the score returned if you search for Output concept \"dog\" in your query. This provides\na natural ranking to search results based on confidence of predictions from the models and\nis used when ANDing multiple of these types of RANK by Output queries together as well.\n\n########## Supported fields ##########\n - data.clusters[].id\n - data.concepts[].id\n - data.concepts[].name\n - data.concepts[].value\n - input.data.image.base64[]\n - input.data.image.url\n - input.id"
        negate:
          type: boolean
          title: 'If True then this will flip the meaning of this part of the

            query. This allow for queries such as dog AND ! metadata=={"blah":"value"}'
        annotation:
          $ref: '#/components/schemas/clarifaiapiAnnotation'
          description: "FILTER by annotation information. This is more flexible than just filtering by\nInput information because in the general case each input can have several annotations.\nSome example use cases for filtering by annotations:\n1) find all the inputs annotated \"dog\" by worker_id = \"XYZ\"\n2) find all the annotations associated with embed_model_version_id = \"123\"\n3) find all the annotations that are trusted, etc.\n\nSince all the annotations under the hood are joined to the embedding model's annotation\nusing worker_id's of other models like cluster models or concept models should be\ncombinable with queries like visual search (a query with Output filled in).\n\n########## Supported fields ##########\n - annotation_info.fields - filter by annotation info\n - data.concepts[].id\n - data.concepts[].name\n - data.concepts[].value\n - data.geo.geo_box[].geo_point.latitude\n - data.geo.geo_box[].geo_point.longitude\n - data.geo.geo_limit.type\n - data.geo.geo_limit.value\n - data.geo.geo_point.latitude\n - data.geo.geo_point.longitude\n - data.image.url\n - data.metadata.fields - filter by metadata. metadata key&value fields are OR-ed.\n - input_id\n - input_level\n - model_version_id\n - status.code\n - task_id\n - trusted\n - user_id"
      description: 'This is the common building block of a query which is a sequence of And messages ANDed together.

        Note that some fields are used too RANK results (affect the scores) and some are used to FILTER

        results (unordered subset of your app''s contents). In general, FILTER operations are more

        efficient queries at scale and when combined with RANK operations can speed up search performance

        as you effectively operate on a smaller sub-set of your entire app.'
