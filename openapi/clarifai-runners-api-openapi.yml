          type: string
          description: 'Amount of CPUs to use as a minimum. This follows kubernetes notation like: "1", "100m", "4.5", etc.

            See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/

            For runners, this is the minimum amount of CPU requested for the runner pod.

            Optional. If unspecified, a small default is used.'
        cpu_memory_requests:
          type: string
          description: 'Amount of CPU memory to use as a minimum. This follows kubernetes notation like:

            1Ki, 1500Mi, 3Gi, 4Ti, etc.

            For runners, this is the minimum amount of CPU memory requested for the runner pod.

            Optional. If unspecified, a small default is used.'
        num_accelerators:
          type: integer
          format: int64
          description: Amount of GPU/TPUs to use.
        accelerator_memory:
          type: string
          description: "The supported accelerators that the resource can run on. If the resource requires a specific\n accelerator type then it will only be scheduled on nodes that have that type of accelerator.\n If there is no hard requirements beyond the number of accelerators and their memory then this\n field can be left empty.\n This setting will cause an error if num_accelerators == 0"
          title: 'Amount of accelerator/GPU memory to use as a minimum.

            This is defined per accelerator.

            This follows the format used by kubernetes like 1Ki, 2Mi, 3Gi, 4Ti.

            See https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/'
        accelerator_type:
          type: array
          items:
            type: string
          description: 'Or should it be removed completely and use the nodepool accelerator type itself.

            These are the supported accelerators that the model can run on.'
        accelerator_topology:
          type: array
          items:
            type: string
          description: 'For multi-host accelerators (i.e., TPU Slices), this defines the slice topology.

            Corresponds to the tpu.googleapis.com/topology annotation.

            Example: "2x2x1" for a 16-chip slice using v4 TPUs.

            Leave empty for single-host accelerators like GPUs or non-slice TPUs.'
      description: 'These are the resource needs of a given API object such as a model.

        This is what they require as a minimum to run and will be used upon scheduling

        as the request and limit for the k8s pod. If we want to separate limits and requests in the

        future we can allow setting a limits ComputeInfo and a requests ComputeInfo.'
    apiAnnotationFilterConfig:
      type: object
      properties:
        annotation_filter:
          $ref: '#/components/schemas/apiAnnotationFilter'
          description: The annotation filter that is used.
        ignore_empty_inputs:
          type: boolean
          description: 'If true, empty inputs are not included in the dataset version.

            If false, empty inputs are included in the dataset version.

            We define an empty input as an input without any annotations after annotation filter is applied.'
    apiInstanceType:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
          description: Short description of instance type.
        compute_info:
          $ref: '#/components/schemas/apiComputeInfo'
        price:
          type: string
        cloud_provider:
          $ref: '#/components/schemas/apiCloudProvider'
          description: The cloud provider where this instance type is available, if any.
        region:
          type: string
          description: The region where this instance type is available, if any.
        allowed_capacity_types:
          $ref: '#/components/schemas/apiNodeCapacityType'
          description: The capacity types allowed for this instance type. If empty - all capacity types are allowed.
        feature_flag_group:
          type: string
          description: The feature flag group associated with this instance type.
        special_handling:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiSpecialHandling'
          description: List of special handling instructions for this instance type.
        architecture:
          type: string
          description: Hardware architecture of the instance type (e.g., "linux/amd64", "linux/arm64").
        available_compute_info:
          $ref: '#/components/schemas/apiComputeInfo'
          description: 'Available compute info after accounting for system overhead (daemonsets, kubelet, etc.).

            This represents the actual resources available for user workloads.'
      description: 'The instance types that will be available in this pool of nodes.

        Clarifai offers multiple different choices that combine cpu cores, memory and accelerator.'
    apiDatasetVersionExportInfo:
      type: object
      properties:
        clarifai_data_protobuf:
          $ref: '#/components/schemas/apiDatasetVersionExport'
          description: clarifai_data_protobuf is a CLARIFAI_DATA_PROTOBUF export of the dataset version.
        clarifai_data_json:
          $ref: '#/components/schemas/apiDatasetVersionExport'
          description: clarifai_data_json is a CLARIFAI_DATA_JSON export of the dataset version.
        coco:
          $ref: '#/components/schemas/apiDatasetVersionExport'
          description: coco is a COCO export of the dataset version.
      description: 'DatasetVersionExportInfo contains information about all exports of a dataset version.


        If the dataset version has not been exported in a format, then the DatasetVersionExport

        field for that format is empty instead of having a "not exported" status.'
    apistatusStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/statusStatusCode'
          description: Status code from internal codes.
        description:
          type: string
          description: A short description of the error.
        details:
          type: string
          description: 'More details of the given error.

            These details may be exposed to non-technical users.

            For technical details, try to use developer_notes field.'
        stack_trace:
          type: array
          items:
            type: string
          description: 'For some environment we may return a stack trace to help debug

            any issues.'
        percent_completed:
          type: integer
          format: int64
          title: specifically for long running jobs
        time_remaining:
          type: integer
          format: int64
          title: if status is pending, how much time is remaining (in seconds)
        req_id:
          type: string
          title: A request ID may be present, to help monitoring and tracking requests
        internal_details:
          type: string
          description: Internal Annotation (do not set in production, for internal Clarifai use only).
        redirect_info:
          $ref: '#/components/schemas/statusRedirectInfo'
          description: Resource location info for redirect, when resource location has been changed.
        developer_notes:
          type: string
          description: 'Notes for developer.

            These notes are rather technical details for developers how to interpret the status,

            e.g. why an error occurred and how to avoid getting the error.'
        http_status_code:
          type: integer
          format: int64
          description: The HTTP status code of the response.
    apiRegion:
      type: object
      properties:
        id:
          type: string
          description: A unique id for the region.
        region_info:
          $ref: '#/components/schemas/apiRegionInfo'
          description: The details about the location of the region.
        data:
          $ref: '#/components/schemas/apiData'
          description: 'A recursive definition of the data within the Region. For example, this will contain

            data.concepts if the region also has annotations or predictions of concepts within it.'
        value:
          type: number
          format: float
          description: This is the confidence score of the overall Region.
        track_id:
          type: string
          description: For tracking algorithsm and annotations we tie regions together with this track id.
      description: A region within the data.
    apiCluster:
      type: object
      properties:
        id:
          type: string
        count:
          type: integer
          format: int64
          title: Number of annotations tied to the cluster in the app
        score:
          type: number
          format: float
          description: 'The score assigned to this cluster.

            For List Clusters endpoint, this represents percentage of inputs in the app assigned to this cluster.'
        hits:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiHit'
          title: Representative hits for cluster (for now we only return 1)
        projection:
          type: array
          items:
            type: number
            format: float
      title: Cluster data
    apiW3C:
      type: object
      properties:
        hex:
          type: string
        name:
          type: string
    VisibilityGettable:
      type: string
      enum:
      - UNKNOWN_VISIBILITY
      - PRIVATE
      - ORG
      - PUBLIC
      default: UNKNOWN_VISIBILITY
      description: "Gettable defined the level of access for GET operations for this resource.\n\n - UNKNOWN_VISIBILITY: Default value not allowed.\n - PRIVATE: PRIVATE requires collaborator or team permissions in order to GET this resource.\n - ORG: ORG requires you to be in the same org in order to GET this resource, but don't have to be a\nteammate or collaborator.\n - PUBLIC: PUBLIC opens up GET access to the resource to any user on the platform even if they are not\na teammate or collaborator."
    apiArgoParameterOverride:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
          title: Argo parameters are always strings
    apiTaskReviewConsensusStrategyInfo:
      type: object
      properties:
        approval_threshold:
          type: integer
          format: int64
          description: 'Deprecated: Use approval_threshold_labelers.'
        approval_threshold_labelers:
          type: integer
          format: int64
          description: 'The number of labelers that need to agree in order to automatically approve an annotation.

            When 0, labelers consensus is disabled.

            When 1, the labels are automatically approved once a single labeler labels the input.

            When greater than 1, the labels are automatically approved when the specified number of labelers agree.

            If the number of labelers that agree is less than the specified number, then the input will reviewed by reviewers.'
        approval_threshold_reviewers:
          type: integer
          format: int32
          title: 'The number of reviewers that need to agree in order to approve an input.

            Currently, the only allowed values are:

            0  - when not set, it defaults to 1

            1  - only a single reviewer needs to approve each labeled input

            -1 - an input will be approved when all reviewers approve it'
      title: TaskReviewConsensusStrategyInfo
    apiArgoOrchestrationStatus:
      type: object
      properties:
        status:
          type: string
          title: Refer https://pkg.go.dev/github.com/argoproj/argo-workflows/v3/pkg/apis/workflow/v1alpha1#WorkflowStatus
      title: Argo Workflow Status message
    apiRunner:
      type: object
      properties:
        id:
          type: string
          description: 'A unique ID for this runner.

            This is a UUID since runners can be automatically orchestrated.'
        description:
          type: string
          description: short description about the runner.
        created_at:
          type: string
          format: date-time
          description: When the runner was created.
        modified_at:
          type: string
          format: date-time
          description: When the runner was last modified.
        metadata:
          type: object
          description: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto

            This is an optional arg.'
        labels:
          type: array
          items:
            type: string
          description: Labels to match in order to find work.
        worker:
          $ref: '#/components/schemas/apiWorker'
          description: 'Instead of just matching on labels we might want to have more explicit matching of what

            work this runner is looking for.

            The thing that the autoscaling config applies to for this nodepool.'
        nodepool:
          $ref: '#/components/schemas/apiNodepool'
          description: 'Runners are defined within nodepools so this field needs the id and user_id of the nodepool

            to be provided when creating a Runner.

            This nodepool must be accessible to you or an org you are part of.'
        compute_info:
          $ref: '#/components/schemas/apiComputeInfo'
          description: '//////////////////////////

            Need resources on the runner so we can schedule this Runner into the Nodepool.

            If this runner is being orchestrated for a model then the orchestrator will set this to the

            model resource requirements. If a workflow then it''ll compute those requirements and set

            populate this resource field.

            Having this on the underlying object like Model and Workflow allows us to represent the minimum

            requirements on those object, which may be less than what the Runner allocates (as a safety

            margin for the runner to for sure run the resource).'
        num_replicas:
          type: integer
          format: int64
          description: 'Number of replicas that this runner should have up.

            We keep it separate from ComputeInfo which defines how many resources each replica needs.'
        special_handling:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiSpecialHandling'
          description: List of special handling instructions for this runner.
        runner_metrics:
          $ref: '#/components/schemas/apiRunnerMetrics'
          description: 'Metrics and status for the underlying k8s deployment.

            Each Runner is 1:1 with a k8s deployment, so this field tracks deployment health and metrics.'
        min_replicas:
          type: integer
          format: int64
          description: 'Hard minimum replicas from the deployment''s autoscale config.

            The agent uses this to determine how many replicas are non-preemptable.'
        priority:
          type: integer
          format: int64
          description: 'The scheduling priority for this runner''s k8s deployment.

            Valid values are 0-9, where higher values indicate higher priority.

            This value comes from the deployment nodepool''s priority setting.'
      title: 'A worker for compute within a nodepool of instances.

        This asks the API for work'
    apiQuery:
      type: object
      properties:
        ands:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiAnd'
          description: 'The query syntax is simply a list of And operatiosn that will be ANDed together to fetch

            results which are returned to the user as Hit messages.


            Deprecated: Only used by the deprecated PostSearches endpoint. Use filters

            and ranks instead with PostInputsSearches or PostAnnotationsSearches.'
        language:
          type: string
          description: 'This allows the query to override any default language the app was setup in when doing Concept

            based searches. This currently only affects public Models Output searches when those public

            Models have translations for their Concepts.'
        filters:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiFilter'
          title: 'filters in this query

            e.q. only fetch annotations that have certain metadata'
        ranks:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiRank'
          title: 'rankings in this query

            e.g. visual search by a url'
      description: This is the search query used in /searches, model training requests, bulk data exports, etc.
    apiTaskReview:
      type: object
      properties:
        strategy:
          $ref: '#/components/schemas/TaskReviewTaskReviewStrategy'
          description: Task review strategy.
        user_ids:
          type: array
          items:
            type: string
          description: 'Who will review this task.

            DEPRECATED: Use users.id instead.'
        users:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiUser'
          description: 'Users who will review this task.

            When the ''review.users'' field is additionally requested, then all user

            info is filled for the reviewers. Otherwise, only the user ''id'' is filled.'
        manual_strategy_info:
          $ref: '#/components/schemas/apiTaskReviewManualStrategyInfo'
        consensus_strategy_info:
          $ref: '#/components/schemas/apiTaskReviewConsensusStrategyInfo'
      title: TaskReview
    apiLabelDistribution:
      type: object
      properties:
        positive_label_counts:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiLabelCount'
      title: LabelDistribution
    apiDeployRestriction:
      type: string
      enum:
      - USAGE_RESTRICTION_NOT_SET
      - NO_LIMITS
      - SHARED_COMPUTE_ONLY
      - DEDICATED_COMPUTE_ONLY
      - MODEL_OWNER_DEDICATED_COMPUTE_ONLY
      default: USAGE_RESTRICTION_NOT_SET
      description: " - USAGE_RESTRICTION_NOT_SET: Default uninitialized state.\n - NO_LIMITS: No restrictions on usage.\n - SHARED_COMPUTE_ONLY: Model can only be used on shared compute resources.\n - DEDICATED_COMPUTE_ONLY: Model can only be used on dedicated compute resources.\n - MODEL_OWNER_DEDICATED_COMPUTE_ONLY: Model can only be used on dedicated compute resources owned by the model owner."
    apiNodeCapacityType:
      type: object
      properties:
        capacity_types:
          type: array
          items:
            $ref: '#/components/schemas/NodeCapacityTypeCapacityType'
      description: 'Type of nodes that are ok for instances in this pool.

        If both spot and on-demand are provided then the runner will be able to run on either

        with a preference for spot until they are not available.'
    BookmarkOriginBookmarkType:
      type: string
      enum:
      - unknown
      - model
      - workflow
      - dataset
      default: unknown
    googlerpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protobufAny'
    apiEvalMetrics:
