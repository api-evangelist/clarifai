        sync_state_request:
          $ref: '#/components/schemas/apiSyncStateRequest'
          description: Agent sync request from control plane.
        auto_annotation_request:
          $ref: '#/components/schemas/apiAutoAnnotationRequest'
          description: "Auto annotation request from a user.\n\nWorkflow request from a user.  // FUTURE\n training request next, etc."
        metadata:
          $ref: '#/components/schemas/apiRunnerItemMetadata'
          description: Metadata used for routing and other purposes.
      description: 'This is a unit of work for a runner to process. This comes from the API

        in the MultiRunnerItemResponse and contains the user''s requests

        to process.'
    apiRunnerItemOutput:
      type: object
      properties:
        multi_output_response:
          $ref: '#/components/schemas/apiMultiOutputResponse'
          description: "The output of a model prediction request.\n\nWorkflow response. // FUTURE\n training response ???"
      title: 'This contains the response of the user''s request once processing is done.

        The runner should fill in the matching output to the RunnerItem.request

        oneof field. This is sent to the API within PostRunnerItemOutputsRequest'
    apiEvalInfo:
      type: object
      properties:
        params:
          type: object
          description: 'To control the evaluation process.

            Allow a list of parameters.'
    apiWorkflowNode:
      type: object
      properties:
        id:
          type: string
          description: 'An identifier for this node in the graph. This is used when connecting NodeInputs

            together.'
        model:
          $ref: '#/components/schemas/apiModel'
          description: 'The model that will do the processing at this node. We only vlidate the model.id and

            model.model_version.id fields.'
        node_inputs:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiNodeInput'
          description: 'Each WorkflowNode can connect to multiple input nodes so that we can handle multi-model data

            and more complex workflow operations.'
        suppress_output:
          type: boolean
          title: suppress the output for workflow prediction
        output_info_override:
          $ref: '#/components/schemas/apiOutputInfo'
          description: 'Used to override the output_info.data and output_info.params of the model specified by the node.

            Values for fields_map, message, and output_config are ignored.'
      title: WorkflowNode
    apiAnnotationFilter:
      type: object
      properties:
        id:
          type: string
          title: The ID for the annotation filter
        created_at:
          type: string
          format: date-time
          description: 'When the annotation filter was created.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        modified_at:
          type: string
          format: date-time
          description: 'When the annotation filter was modified.

            The format is https://www.ietf.org/rfc/rfc3339.txt.

            Example: "2006-01-02T15:04:05.999999Z".'
        user_id:
          type: string
          description: The user the annotation filter belongs to.
        app_id:
          type: string
          description: The app the annotation filter belongs to.
        search:
          $ref: '#/components/schemas/apiSearch'
          description: The search that this filter uses.
      description: 'AnnotationFilter is used to create a new dataset version.

        For now, the filter is simply a wrapper over a Search.

        In the future, we may add extra fields to customize the filtering.'
    apiTaskWorkMetrics:
      type: object
      properties:
        inputs_count_estimated:
          type: string
          format: uint64
          description: Estimated number of inputs that workers have worked on.
        inputs_percent_estimated:
          type: integer
          format: int64
          description: 'Estimated percent of inputs that workers have worked on.

            This is a value between 0 and 100, where 0 = 0% and 100 = 100%.'
    apiModelPredictConfig:
      type: object
      properties:
        model:
          $ref: '#/components/schemas/apiModel'
          description: Assumed to be owned by the calling users app unless user_id and app_id are filled out.
    apiMask:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/apiImage'
          description: The image of the mask in a non-raster format.
      description: Segmentation mask.
    apiAppExtraInfo:
      type: object
      properties:
        search_revision_marker:
          type: string
          title: 'Revision marker for this application.

            The value of the revision changes when

            * inputs are added, updated or deleted

            * annotations are added, updated or deleted

            * inputs are added to or removed from datasets

            For example, this value can be used to detect if client side caches related to searching should be invalidated.

            Field not filled in for list endpoints, use GetApp'
        counts:
          $ref: '#/components/schemas/apiAppResourceCounts'
    apiDeploymentMetrics:
      type: object
      properties:
        desired_replicas:
          type: integer
          format: int64
          description: 'Deprecated: use aggregate instead.'
        live_replicas:
          type: integer
          format: int64
          description: 'Deprecated: use aggregate instead.'
        rollout_in_progress:
          type: boolean
          description: 'Deprecated: use aggregate instead.'
        nodepool_metrics:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiNodepoolDeploymentMetrics'
          description: Per-nodepool breakdown of metrics.
        aggregate:
          $ref: '#/components/schemas/apiDeploymentMetricsSummary'
          description: Aggregate metrics across all nodepools.
      description: 'DeploymentMetrics captures metrics and status for a Deployment''s underlying runners.

        This allows tracking of the desired replica count and the actual live replica count.'
    apiRunnerSelector:
      type: object
      properties:
        nodepool:
          $ref: '#/components/schemas/apiNodepool'
          description: 'A particular nodepool for the resource to be run within. This request the id and user_id of

            the nodepool to be specified. Runners will be scaled according to a deployment for the given

            resource to be run. There should not be more than one deployment in this nodepool for the

            particular resource to run. If no deployments then default autoscaling will be used.'
        runner:
          $ref: '#/components/schemas/apiRunner'
          description: Optionally a particular runner within the nodepool.
        deployment:
          $ref: '#/components/schemas/apiDeployment'
          description: "Optionally a particular deployment within the nodepool.\n\nIn future as we support matching runners based on just labels:\n RunnerLabels runner_labels = 3; // FUTURE"
      description: '////////////////////////////////////////

        Don''t need RunnerSelector if we''re opening up endpoints for deployments.

        ////////////////////////////////////////

        The RunnerSelector is an optional field we can provide during runtime

        of model/workflow predictions to specify which particular runner we want to process the work.

        This can optionally be used to select a particular nodepool and then within that nodepool

        a particular runner.'
    apiTaskAIAssistant:
      type: object
      properties:
        workflow_id:
          type: string
          description: 'The worker is helped by an AI assistant.

            This field is the workflow id which is used to assist the worker with predictions.

            If empty, then AI assistant is disabled.'
        workflow:
          $ref: '#/components/schemas/apiWorkflow'
      title: TaskAIAssistant
    apiOrchestrationArgsOverride:
      type: object
      properties:
        argo_args_override:
          $ref: '#/components/schemas/apiArgoArgsOverride'
          description: 'Future: KubeFlowArgsOverride, AirflowArgsOverride, etc.'
    apiSearch:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/apiQuery'
          description: Search query.
        id:
          type: string
          description: 'Customer facing, external ID for search to be saved. Provided by the user, e.g. "saved-search-1.

            It is unique per application.'
        application_id:
          type: string
          description: Application that owns this saved search.
        name:
          type: string
          description: Human readable display name of the saved search.
        as_of:
          type: string
          format: date-time
          description: '"As of" timestamp, indicating a time in the past as of which we want to

            retrieve the annotations satisfying the query.'
        git_hash:
          type: string
          description: Git hash of the code that ran the filter.
        created_at:
          type: string
          format: date-time
          description: When the saved search was created.
        modified_at:
          type: string
          format: date-time
          description: When the saved search was updated.
        algorithm:
          type: string
          title: 'The search algorithm to be used.

            Options are are ''nearest_neighbor'', ''brute_force'', and ''avg_concept_brute_force''

            The last two perform a brute force search visual search instead of a more scalable distributed

            nearest neighbor search and should be used by advanced users only.

            If not specified we default to nearest neighbor'
        save:
          type: boolean
          title: 'If true, save this search, and exit without executing the search.

            If false execute the query'
        min_value:
          type: number
          format: float
          description: 'Minimum value of confidence threshold score in result.

            Defaults to 0.0 which means we won''t do any thresholding as all probabilities will

            likely be > 0.0.'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        metric:
          $ref: '#/components/schemas/SearchMetric'
      description: This is the new Search object used in saved searches.
    NodeCapacityTypeCapacityType:
      type: string
      enum:
      - UKNOWN_CAPACITY_TYPE
      - ON_DEMAND_TYPE
      - SPOT_TYPE
      default: UKNOWN_CAPACITY_TYPE
    apiPostRunnerItemOutputsRequest:
      type: object
      properties:
        user_app_id:
          $ref: '#/components/schemas/apiUserAppIDSet'
        nodepool_id:
          type: string
          title: The particular nodepool that runner belongs to
        runner_id:
          type: string
          description: The particular runner that processed the work.
        runner_item_id:
          type: string
          description: The particular item of work processed.
        runner_item_outputs:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiRunnerItemOutput'
          description: This allows you to create one or more runner by posting it to the API.
        status:
          $ref: '#/components/schemas/apistatusStatus'
          description: 'This request has a status so that it can communicate to the API from runners and

            communicate status, errors, etc. This is on the request since runners operate

            in a reverse protocol. This status is also used to initiate the

            ProcessRunnerItems request with RUNNER_STREAM_START code.'
        runner_replica_id:
          type: string
          description: 'A unique ID to represent the runner. This may be tied to an underlying compute instance

            information or just an UUID.'
        compute_cluster_id:
          type: string
        cloud_provider_id:
          type: string
          description: Used by agent runners to specify their cloud provider.
        region:
          type: string
          description: Used by agent runners to specify their region.
      description: 'PostRunnerItemOutputsRequest

        This is the message that runners send to the API to communicate.

        At the end of the request it will have the RunnerItemOutput filled in

        with results of the workload the runner is processing. Other messages

        from the runner use this same proto to communicate over to the API

        and do handshakes.'
    apiROC:
      type: object
      properties:
        fpr:
          type: array
          items:
            type: number
            format: float
        tpr:
          type: array
          items:
            type: number
            format: float
        thresholds:
          type: array
          items:
            type: number
            format: float
        fpr_per_image:
          type: array
          items:
            type: number
            format: float
        fpr_per_object:
          type: array
          items:
            type: number
            format: float
      title: ROC
    apiTextInfo:
      type: object
      properties:
        char_count:
          type: integer
          format: int32
          title: count of characters in text
        encoding:
          type: string
          title: text encoding
    apiTaskTaskType:
      type: string
      enum:
      - TYPE_NOT_SET
      - CONCEPTS_CLASSIFICATION
      - BOUNDING_BOX_DETECTION
      - POLYGON_DETECTION
      default: TYPE_NOT_SET
      description: " - CONCEPTS_CLASSIFICATION: Concepts classification tasks annotate concepts for the overall image, frame of video or section of text.\n - BOUNDING_BOX_DETECTION: Bounding box detection tasks annotate rectangular bounding box regions around each concept in an image, frame of video or section of text.\n - POLYGON_DETECTION: Polygon detection tasks annotate free-form regions around concepts in an image, frame of video or section of text."
    apiNodepool:
      type: object
      properties:
        id:
          type: string
          description: The user defined ID of the nodepool.
        description:
          type: string
          description: Short description about the nodepool.
        created_at:
          type: string
          format: date-time
          description: When the nodepool was created.
        modified_at:
          type: string
          format: date-time
          description: When the nodepool was last modified.
        compute_cluster:
          $ref: '#/components/schemas/apiComputeCluster'
          description: Which cluster this nodepool is within.
        node_capacity_type:
          $ref: '#/components/schemas/apiNodeCapacityType'
        instance_types:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiInstanceType'
        min_instances:
          type: integer
          format: int64
          description: 'Minimum number of instances in this nodepool. This allows the nodepool to scale down to this

            amount. This is the user desired minimum.'
        max_instances:
          type: integer
          format: int64
          description: 'An upper limit on the number of instances in this nodepool. This allows the nodepool to scale

            up to this amount. This is the user desired maximum.'
        enforced_min_instances:
          type: integer
          format: int64
          description: The actual minimum number of instances. Enforced by the user's plan limits.
        enforced_max_instances:
          type: integer
          format: int64
          description: The actual maximum number of instances. Enforced by the user's plan limits.
        warm_instances:
          type: integer
          format: int64
          description: 'Number of warm idle instances to keep in this nodepool.

            These allow the nodepool to have extra capacity ready for quickly scheduling additional runners.

            This is the user desired amount. See node_count for actual current number of nodes.'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        metadata:
          type: object
          title: 'To handle arbitrary json metadata:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        special_handling:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiSpecialHandling'
          description: List of special handling instructions for this nodepool.
        node_count:
          type: integer
          format: int64
          description: 'The current number of nodes in this nodepool. This value is queried from Prometheus metrics

            and represents the most recent node count reported by the compute plane.'
        status:
          $ref: '#/components/schemas/NodepoolNodepoolStatus'
          description: Current status of the nodepool.
        status_description:
          type: string
          description: Human-readable status description. Contains error details when status is NODEPOOL_STATUS_ERROR.
      description: 'A nodepool is a set of nodes dedicated for a given user''s compute needs.

        This compute will typically be consumed by runners and in the future other objects

        like UI modules may be assigned to node pools.'
    apiConceptExtraInfo:
      type: object
      properties:
        is_rankable:
          type: boolean
          description: Whether this concept is rankable based on ConceptExtraInfoRequest configuration.
      description: 'ConceptExtraInfo represents extra information related to a concept that is context-dependent.

        It is only set when requested in ConceptExtraInfoRequest.'
    apiDatasetVersionExportFormat:
      type: string
      enum:
      - DATASET_VERSION_EXPORT_FORMAT_NOT_SET
      - CLARIFAI_DATA_PROTOBUF
      - CLARIFAI_DATA_JSON
      - COCO
      default: DATASET_VERSION_EXPORT_FORMAT_NOT_SET
      description: " - CLARIFAI_DATA_PROTOBUF: CLARIFAI_DATA_PROTOBUF is the proprietary Clarifai API Data format. It\nis a ZIP-archive containing batches of serialized InputBatch protobuf messages.\n\nNote that only the \"id\" and \"data\" fields of exported inputs are set.\n - CLARIFAI_DATA_JSON: CLARIFAI_DATA_JSON is the proprietary Clarifai API Data format in JSON. It\nis a ZIP-archive containing batches of serialized InputBatch JSON messages.\n\nNote that only the \"id\" and \"data\" fields of exported inputs are set.\n - COCO: COCO is the data format used by Common Objects in Context. It is a\nZIP-archive containing JSON files with the dataset version annotations.\nSee https://cocodataset.org/#format-data."
    apiDatasetVersionMetrics:
      type: object
      properties:
        inputs_count:
          type: string
          format: uint64
          title: Number of inputs
        unlabeled_inputs_count:
          type: string
          format: uint64
          description: 'Number of unlabeled inputs

            An input is considered unlabeled if it there are no annotations with positive labels for that input.'
        inputs_with_metadata_count:
          type: string
          format: uint64
          title: Number of inputs that have metadata
        inputs_with_geo_count:
          type: string
          format: uint64
          title: Number of inputs that have geo information
        regions_count:
          type: string
          format: uint64
          title: Number of regions
        region_location_matrix:
          $ref: '#/components/schemas/MatrixUint64'
          title: 'The matrix shows where the regions are located.

            Example: If the matrix has 2x2 dimensions, then

            * region_location_matrix[0][0] = the number of regions that appear in the top left corner, i.e. [0,0]..(0.5,0.5)

            * region_location_matrix[0][1] = the number of regions that appear in the top right corner, i.e. [0,0.5]..[0.5,1]

            * region_location_matrix[1][0] = the number of regions that appear in the bottom left corner, i.e. [0.5,0]..[1,0.5)

            * region_location_matrix[1][1] = the number of regions that appear in the bottom right corner, i.e. [0.5,0.5]..[1,1]'
        bounding_boxes_count:
          type: string
          format: uint64
          title: Number of bounding boxes
        polygons_count:
          type: string
          format: uint64
          title: Number of polygons
        points_count:
          type: string
          format: uint64
          title: Number of points
        masks_count:
          type: string
          format: uint64
          title: Number of masks
        region_inputs_count:
          type: string
          format: uint64
          description: 'Number of inputs that have regions attached

            Note that this is not a recursive count: if an input contains frames that contains regions, then the region_frames_count is increased, but region_inputs_count is not increased.'
        region_frames_count:
          type: string
          format: uint64
          title: Number of frames that have regions attached
        frames_count:
          type: string
          format: uint64
          title: Number of frames
        frame_inputs_count:
          type: string
          format: uint64
          title: Number of inputs that have frames attached
        embeddings_count:
          type: string
          format: uint64
          title: Number of embeddings
        positive_input_tags_count:
          type: string
          format: uint64
          title: Number of positive tags added at input-level
        positive_region_tags_count:
          type: string
          format: uint64
          title: Number of positive tags added at region-level
        positive_frame_tags_count:
          type: string
          format: uint64
          title: Number of positive tags added at frame-level
    apiThresholdRange:
      type: object
      properties:
        is_lower_inclusive:
          type: boolean
          title: 'The range used to filter over concept values.

            e.g. GREATER_THAN_OR_EQUAL_TO 0.7 -> is_lower_inclusive = true, lower = 0.7, is_upper_inclusive = true, upper = 1.0

            e.g. (0.3, 0.75] -> is_lower_inclusive = false, lower = 0.3, is_upper_inclusive = true, upper = 0.75'
        is_upper_inclusive:
          type: boolean
        lower:
          type: number
          format: float
        upper:
          type: number
          format: float
    apiKeypointInfo:
      type: object
      properties:
        keypoint_names:
          type: array
          items:
            type: string
          title: Names of the keypoints
        skeleton:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/apiKeypointEdge'
          description: Defines the connections between keypoint_names. Each value represents the index in keypoint_names.
    apiTrainInfo:
      type: object
      properties:
        params:
          type: object
          description: 'To control the training process when PostModelVersions is used we allow a list of parameters

            defined for each ModelType as a Struct (JSON object) here. During training, the settings

            contained within are sent to the training processor to alter the training process.'
        dataset:
          $ref: '#/components/schemas/apiDataset'
          title: The dataset and dataset version this model version was or will be trained on
        resume_from_model:
          $ref: '#/components/schemas/apiModel'
          description: The model to resume training from.
    TaskReviewTaskReviewStrategy:
      type: string
      enum:
      - TASK_REVIEW_STRATEGY_NOT_SET
      - NONE
      - MANUAL
      - CONSENSUS
      default: TASK_REVIEW_STRATEGY_NOT_SET
      description: " - NONE: No review is needed.\nWhen a labeler labels an input, the annotations are immediately approved.\n - MANUAL: Human reviewers will review the work done by labelers.\n - CONSENSUS: Automatically approve inputs when labelers reach consensus.\nIf consensus is not reached, then it will fallback to human reviewers."
    apiHit:
      type: object
      properties:
        score:
          type: number
          format: float
          description: 'This is the score for the ranked Hit results of the search query. This score is a number

            between 0.0 and 1.0 as it represents a confidence in the search Hit. For example, if you search

            for "car" and get a close matching Hit, the score should be close to 1.0. If you get a score

            of close to 0.0 that means it''s very disimilar to your query, in this case NOT a "car". There

            is a special intermediate score of 0.5 that means that the Hit is not really correlated with

            your search query (ie. not similar or dissimlar to the query) which is a common occurrence

            when using negate queries.

            Note: some queries that are just filtering down your app of inputs may just return a score of

            1.0 for all Hits.'
        input:
          $ref: '#/components/schemas/apiInput'
          description: 'This is the matched input returned from the search query. This will contain information about

            the Input such as the url, created_at time and trusted annotation information (for backwards

            compatibility with apps that existed before Annotations were introduced.'
        annotation:
          $ref: '#/components/schemas/clarifaiapiAnnotation'
          description: 'We also provide back the specific matched annotation for the above input. We do this in order

            to support more complex Annotation queries in the And message below. For example if we match

            the search results to a region in your input, or a frame in a video input, this annotation

            field will be that matched annotation info and the input will be the image/video that the user

            originally added which contains those regions / frames.'
        user_id:
          type: string
          description: The customer-facing id of the user who owns the app the asset came from.
        app_id:
          type: string
          description: The cfid of the app the asset came from.
      title: Hit
    apiNDArray:
      type: object
      properties:
        buffer:
          type: string
          format: byte
          title: The bytes of data from the array from array.tobytes()
        shape:
          type: array
          items:
            type: integer
            format: int64
          description: Simply the shape of the numpy array. array.shape.
        dtype:
          type: string
          description: 'Dtype for numpy. You can get it back from this string format using:

            np.dtype(''float32'') for example.'
      description: 'To convert this proto ''ndarray_proto'' to a numpy array:

        array = np.frombuffer(ndarray_proto.buffer, dtype=ndarray_proto.dtype)

        array = array.reshape(tuple(ndarray_proto.shape))'
      title: 'A representation of a numpy array as a proto.

        To convert a numpy array ''ndarray'' to this proto do:

        NDArray(buffer=ndarray.tobytes(), shape=ndarray.shape, dtype=str(ndarray.dtype))'
    apiModel:
      type: object
      properties:
        id:
          type: string
          description: The model's ID. Must be unique within a particular app and URL-friendly.
        name:
          type: string
          description: 'DEPRECATED: Please use the model id to name the model.'
        created_at:
          type: string
          format: date-time
          title: "When the model was created. We follow the XXXX timestamp\nformat. We use https://www.ietf.org/rfc/rfc3339.txt format:\n\"2006-01-02T15:04:05.999999Z\" so you can expect results like\n the following from the API:\n \"2017-04-11T21:50:50.223962Z\""
        modified_at:
          type: string
          format: date-time
          title: When was the most recent model version created at
        app_id:
          type: string
          description: The app the model belongs to.
        output_info:
          $ref: '#/components/schemas/apiOutputInfo'
          title: 'Info about the model''s output and configuration.

            DEPRECATED: Will be moved to model version'
        model_version:
          $ref: '#/components/schemas/apiModelVersion'
          description: 'A particular version of the model, e.g., to specify the version when creating a workflow or

            when listing Models to include the latest ModelVersion of the model in the response.'
        display_name:
          type: string
          description: 'DEPRECATED: Please use the model id to name the model.'
        user_id:
          type: string
          description: The user id that the model belongs to.
        default_eval_info:
          $ref: '#/components/schemas/apiEvalInfo'
          description: The default evaluation info. Can be overwritten by eval request.
