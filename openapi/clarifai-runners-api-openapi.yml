          description: 'The list of nodes retrieved from latest workflow version.

            Each node can specify an input node that it connects to in order to define the graph.'
        metadata:
          type: object
          title: 'To handle arbitrary json metadata you can use a struct field:

            https://github.com/google/protobuf/blob/master/src/google/protobuf/struct.proto'
        visibility:
          $ref: '#/components/schemas/clarifaiapiVisibility'
          description: 'The visibility field represents whether this message is privately/publicly visible.

            To be visible to the public the App that contains it AND the User that contains the App must

            also be publicly visible.'
        user_id:
          type: string
          title: The user the workflow belongs to
        modified_at:
          type: string
          format: date-time
          title: When the workflow was last modified
        version:
          $ref: '#/components/schemas/apiWorkflowVersion'
          description: Info about the workflow version used to return the latest version when listing Workflows.
        is_starred:
          type: boolean
          title: 'Is starred by the requesting user (only showed on get/list requests)

            Please use PostWorkflowStars/DeleteWorkflowStars endpoints to star/unstar a workflow'
        star_count:
          type: integer
          format: int32
          title: 'How many users have starred the workflow (only showed on get/list requests)

            Computed value, not editable'
        description:
          type: string
          title: Short description about this workflow
        notes:
          type: string
          description: 'Notes for the workflow

